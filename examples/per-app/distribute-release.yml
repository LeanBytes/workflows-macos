# ── Per-app release shell ────────────────────────────────────────────────────
# Copy to .github/workflows/distribute-release.yml. Each product releases
# INDEPENDENTLY via its own version tag: bare `vX.Y.Z` for the primary product
# (the one without an "id"), `<id>-vX.Y.Z` for the others. The orchestrator
# parses the tag → the product, validates the version against that product's
# inline changelog, and builds + publishes its Direct leg: stable DMG, Sparkle
# stable feed, Changelog.json, GitHub release.
#
# App Store legs build nothing here: you submit the build you tested in
# TestFlight in App Store Connect. For a product without a Direct leg, the tag
# is just the marker of what shipped (and stops further builds of that version).
# ─────────────────────────────────────────────────────────────────────────────
name: Distribute Release

on:
  push:
    tags:
      - 'v[0-9]*'         # the primary product, e.g. v2.13.0
      - '*-v[0-9]*'       # any other product, e.g. pro-v2.13.0
      - '!*-beta.*'       # exclude the Direct betas distribute.yml pushes
      - '!*-alpha.*'      # exclude manual alphas

permissions:
  contents: write
  discussions: write     # required only for the opt-in create-discussion path

jobs:
  release:
    uses: LeanBytes/workflows-macos/.github/workflows/distribute-release.yml@v0.6.2
    secrets:
      DEVELOPER_ID_P12_BASE64:        ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:          ${{ secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:              ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:                     ${{ secrets.ASC_KEY_ID }}               # profiles, notarization
      ASC_ISSUER_ID:                  ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:                 ${{ secrets.ASC_KEY_BASE64 }}
      AWS_ACCESS_KEY_ID:              ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:          ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SPARKLE_ED_PRIVATE_KEY:         ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    # with:
    #   use-tuist: true
    #   runs-on-build-mac-direct: '"macos-26"'  # runners default to self-hosted macOS; override to hosted (or a specific runner) here
    #   create-discussion: true          # opt-in; needs Discussions + the exact category
    #   attach-release-assets: false     # skip GitHub-Release asset upload (S3 keeps the DMG/ZIP) — saves budget
    #   artifact-retention-days: 30      # keep uploaded build artifacts longer than the 7-day default
