# ── Alpha (invite-only) Distribution Orchestrator ────────────────────────────
# Called from a per-app shell triggered MANUALLY (workflow_dispatch), run against
# any branch (e.g. a "3.0" / "v3" branch). Builds every leg of one product, signed
# like a real release, and hands it out PRIVATELY — off the public machinery:
#
#   * App Store legs → TestFlight, marked internal-only: App Store Connect keeps
#     the build from external testers and the App Store. Internal groups with
#     automatic distribution get it like any other build.
#   * Direct and Ad Hoc legs → an UNLISTED `alpha/<label>/` S3 prefix, handed
#     out by link. No Sparkle appcast, no Changelog.json, no GitHub Release.
#   * A product with a Direct leg pushes `<prefix><base>-alpha.<N>`: the tag pins
#     the exact commit handed out and is the next run's counter. Without a
#     Direct leg there is no tag — a tag marks a build that reaches customers on
#     its own.
#
# `product-id` picks the product (optional when the repo has only one); the base
# version is its `changelog.versions[0].version`, or `version-base`. The base
# must be unreleased.
#
# IMPORTANT — the alpha tag must NOT fire the release flow. Your per-app
# distribute-release.yml tag filter must exclude `!*-alpha.*` (it already
# excludes betas), or the tag push triggers a real release.
#
# Per-app shell (the full one is examples/per-app/distribute-alpha.yml):
#
#   on:
#     workflow_dispatch:
#   jobs:
#     alpha:
#       uses: LeanBytes/workflows-macos/.github/workflows/distribute-alpha.yml@v0.6.2
#       secrets:
#         # … the same block as distribute.yml, minus Sparkle and Jira
# ─────────────────────────────────────────────────────────────────────────────
name: distribute-alpha

on:
  workflow_call:
    inputs:
      product-id:
        description: "The product (Config/products/<id>.json) to build. May stay empty when the repo has one product."
        type: string
        default: ""
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"
      version-base:
        description: "Base version for the alpha (e.g. '3.0.0'). Empty = the product file's changelog.versions[0].version."
        type: string
        default: ""

      # ── Per-app build flags (same meaning as the other orchestrators) ──────
      use-tuist:
        type: boolean
        default: false
      lfs:
        description: "Pull the caller repo's git LFS files on checkout. Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep the uploaded build artifacts in a private repo (default 7; a public repo keeps them one day)."
        type: number
        default: 7
      pre-build-cache-path:
        type: string
        default: ""
      pre-build-cache-key:
        type: string
        default: ""
      pre-build-script:
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""
      extra-xcodebuild-args:
        type: string
        default: ""
      runs-on-prepare:
        description: "Runner for the prepare job (resolves the product + alpha counter). Runs FIRST and every other job needs it, so a repo with no self-hosted Mac must point this at a hosted image too."
        type: string
        default: '["self-hosted","macOS"]'
      build-timeout-minutes:
        description: "Ceiling for each build job. Forwarded to the build callees."
        type: number
        default: 60
      archive-timeout-minutes:
        description: "Ceiling for the Archive step inside each build job. Must stay under build-timeout-minutes."
        type: number
        default: 30
      runs-on-build-ios:
        description: "Runner for the iPhone and iPad archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-build-mac-store:
        description: "Runner for the Mac App Store archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-build-mac-direct:
        description: "Runner for the Developer ID (Direct) archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-publish:
        description: "Publish job runner (altool + AWS CLI + a git tag push)."
        type: string
        default: '["self-hosted","macOS"]'

    secrets:
      APPLE_DISTR_P12_BASE64:         { required: false }
      APPLE_DISTR_PASSWORD:           { required: false }
      MAC_DISTR_P12_BASE64:           { required: false }
      MAC_DISTR_PASSWORD:             { required: false }
      DEVELOPER_ID_P12_BASE64:        { required: false }
      DEVELOPER_ID_PASSWORD:          { required: false }
      # A leg can sign with another certificate by naming these in
      # "cert-secret" / "cert-password-secret"; unset falls back to the team's own.
      APPLE_DISTR_P12_ALT_BASE64:     { required: false }
      APPLE_DISTR_PASSWORD_ALT:       { required: false }
      DEVELOPER_ID_P12_ALT_BASE64:    { required: false }
      DEVELOPER_ID_PASSWORD_ALT:      { required: false }
      KEYCHAIN_PASSWORD:              { required: false }
      ASC_KEY_ID:                     { required: false }
      ASC_ISSUER_ID:                  { required: false }
      ASC_KEY_BASE64:                 { required: false }
      AWS_ACCESS_KEY_ID:              { required: false }
      AWS_SECRET_ACCESS_KEY:          { required: false }
      SHARED_WORKFLOWS_TOKEN:         { required: false }

permissions:
  contents: write          # to push the <prefix><base>-alpha.<N> tag

# Serialize alpha runs across the repo so two manual dispatches can't race on a
# product's alpha counter.
concurrency:
  group: distribute-alpha-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    # `vars.RUNS_ON_PREPARE` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PREPARE || fromJSON(inputs.runs-on-prepare) }}
    timeout-minutes: 5
    outputs:
      target-id: ${{ steps.plan.outputs.target-id }}
      version: ${{ steps.plan.outputs.version }}
      alpha-label: ${{ steps.plan.outputs.alpha-label }}
      alpha-tag: ${{ steps.plan.outputs.alpha-tag }}
      build-number: ${{ steps.plan.outputs.build-number }}
      legs: ${{ steps.plan.outputs.legs }}
      ios-legs: ${{ steps.plan.outputs.ios-legs }}
      mac-store-legs: ${{ steps.plan.outputs.mac-store-legs }}
      mac-direct-legs: ${{ steps.plan.outputs.mac-direct-legs }}
      has-ios: ${{ steps.plan.outputs.has-ios }}
      has-mac-store: ${{ steps.plan.outputs.has-mac-store }}
      has-mac-direct: ${{ steps.plan.outputs.has-mac-direct }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full tag history for the alpha counter + the released check
          fetch-tags: true

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Plan the alpha
        id: plan
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
          PRODUCT_ID: ${{ inputs.product-id }}
          VERSION_BASE: ${{ inputs.version-base }}
        run: python3 .shared-ci/.github/scripts/products.py plan-alpha >> "$GITHUB_OUTPUT"

      - name: Show the alpha
        run: echo "Alpha ${{ steps.plan.outputs.alpha-label }} of '${{ steps.plan.outputs.target-id }}' (build ${{ steps.plan.outputs.build-number }}) — tag '${{ steps.plan.outputs.alpha-tag }}'"

  build-ios:
    if: needs.prepare.outputs.has-ios == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.ios-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-ios.yml@v0.6.2
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-name: ios-build-${{ matrix.leg.leg }}
      scheme: ${{ matrix.leg.scheme }}
      configuration: ${{ matrix.leg.configuration }}
      profile-type: ${{ matrix.leg.profile-type }}
      export-method: ${{ matrix.leg.export-method }}
      internal-only: ${{ matrix.leg.internal-only }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-ios }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64:  ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:    ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  build-mac-store:
    if: needs.prepare.outputs.has-mac-store == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.mac-store-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-mac-store.yml@v0.6.2
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-name: mac-store-build-${{ matrix.leg.leg }}
      scheme: ${{ matrix.leg.scheme }}
      configuration: ${{ matrix.leg.configuration }}
      internal-only: ${{ matrix.leg.internal-only }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-mac-store }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64:  ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:    ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      MAC_DISTR_P12_BASE64:    ${{ secrets.MAC_DISTR_P12_BASE64 }}
      MAC_DISTR_PASSWORD:      ${{ secrets.MAC_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  build-mac-direct:
    if: needs.prepare.outputs.has-mac-direct == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.mac-direct-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-mac-direct.yml@v0.6.2
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}                 # e.g. "3.0.0-alpha.1"
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-label: ${{ matrix.leg.artifact-label }}
      artifact-name: mac-direct-build-${{ matrix.leg.leg }}
      scheme-name: ${{ matrix.leg.scheme }}
      product-name: ${{ matrix.leg.product-name }}
      configuration: ${{ matrix.leg.configuration }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-mac-direct }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:   ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  publish-alpha:
    needs: [prepare, build-ios, build-mac-store, build-mac-direct]
    # 'skipped' stays permitted (a product without a leg of some kind); a failed
    # or cancelled build must not hand out half an alpha (see #10).
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-ios.result != 'failure' && needs.build-ios.result != 'cancelled' &&
      needs.build-mac-store.result != 'failure' && needs.build-mac-store.result != 'cancelled' &&
      needs.build-mac-direct.result != 'failure' && needs.build-mac-direct.result != 'cancelled' &&
      (needs.build-ios.result == 'success' || needs.build-mac-store.result == 'success' || needs.build-mac-direct.result == 'success')
    # `vars.RUNS_ON_PUBLISH` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PUBLISH || fromJSON(inputs.runs-on-publish) }}
    timeout-minutes: 30
    env:
      LABEL: ${{ needs.prepare.outputs.alpha-label }}
      ALPHA_TAG: ${{ needs.prepare.outputs.alpha-tag }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      LEGS_JSON: ${{ needs.prepare.outputs.legs }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need the branch ref to push the tag

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Download ios-build artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: ios-build-*
          path: ./artifacts/ios

      - name: Download mac-store-build artifacts
        if: needs.build-mac-store.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mac-store-build-*
          path: ./artifacts/mac-store

      - name: Download mac-direct-build artifacts
        if: needs.build-mac-direct.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mac-direct-build-*
          path: ./artifacts/mac-direct

      # \x1f-delimited, NOT tab — tab is IFS-whitespace and `read` would
      # collapse an empty s3-subpath, shifting every later column.
      #   legs.tsv: leg id pname plat chan dist bid sub kind
      - name: Expand legs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$LEGS_JSON" > /tmp/legs.tsv <<'PY'
          import json, sys
          KIND = {("ios", "app-store"): "ios", ("ios", "ad-hoc"): "ios",
                  ("macos", "app-store"): "mac-store", ("macos", "direct"): "mac-direct"}
          fields = ["leg", "id", "product-name", "platform", "channel", "distribute", "bundle-id", "s3-subpath"]
          for l in json.loads(sys.argv[1]):
              print("\x1f".join([str(l.get(k, "")) for k in fields] + [KIND[(l["platform"], l["channel"])]]))
          PY
          echo "Legs:"; tr '\037' '\t' < /tmp/legs.tsv

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          # A LONE matched artifact is extracted flat into the base path; re-nest
          # it so the per-leg globs below can assume artifacts/<kind>/<kind>-build-<leg>/.
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub kind; do
            base="./artifacts/$kind"; want="$base/$kind-build-$leg"
            if [ -d "$base" ] && [ ! -d "$want" ] && [ -n "$(find "$base" -maxdepth 1 -type f 2>/dev/null)" ]; then
              mkdir -p "$want"
              find "$base" -maxdepth 1 -type f -exec mv {} "$want"/ \;
              echo "re-nested flattened $kind artifact → $want/"
            fi
          done < /tmp/legs.tsv

      # Exported internal-only (testFlightInternalTestingOnly), so App Store
      # Connect keeps it from external testers and the App Store.
      - name: Upload to TestFlight, internal only (per app-store leg)
        if: needs.build-ios.result == 'success' || needs.build-mac-store.result == 'success'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -uo pipefail
          source .shared-ci/.github/scripts/classify-upload.sh
          # altool reads the key from here; Cleanup removes it.
          mkdir -p ~/.appstoreconnect/private_keys
          (umask 077; echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8)
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub kind; do
            [ "$chan" = "app-store" ] || continue
            [ "$dist" = "True" ] || { echo "leg $leg: distribute=false — skipping upload"; continue; }
            echo "::group::TestFlight upload — $leg"
            if [ "$plat" = "ios" ]; then ext=ipa; type=ios; else ext=pkg; type=macos; fi
            FILE=$(ls ./artifacts/$kind/$kind-build-$leg/*.$ext 2>/dev/null | head -1 || true)
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "::error::No .$ext for leg $leg"; echo "::endgroup::"; exit 1
            fi
            set +e
            OUTPUT=$(xcrun altool --upload-app --type "$type" --file "$FILE" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            RC=$?
            set -e
            echo "$OUTPUT"
            case "$(classify_upload "$RC" "$OUTPUT")" in
              accepted)        echo "TestFlight upload accepted for $leg"; echo "::endgroup::"; continue ;;
              already-present) echo "Build for $leg already present — treating as success."; echo "::endgroup::"; continue ;;
            esac
            echo "::error::altool failed for $leg (exit ${RC})"; echo "::endgroup::"; exit 1
          done < /tmp/legs.tsv

      - name: Install AWS CLI
        if: needs.build-mac-direct.result == 'success' || contains(needs.prepare.outputs.ios-legs, '"channel":"ad-hoc"')
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws &>/dev/null; then
            curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
            sudo installer -pkg /tmp/AWSCLIV2.pkg -target /
            rm -f /tmp/AWSCLIV2.pkg
          fi
          aws --version

      # Upload to an UNLISTED `alpha/<label>/` prefix — hand-out-the-URL only.
      - name: Upload to S3 (unlisted alpha prefix, Direct + Ad Hoc)
        if: needs.build-mac-direct.result == 'success' || contains(needs.prepare.outputs.ios-legs, '"channel":"ad-hoc"')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
          S3_DOWNLOAD_URL: ${{ vars.S3_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub kind; do
            case "$chan" in
              direct)
                DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}/alpha/${LABEL}"
                for f in ./artifacts/mac-direct/mac-direct-build-$leg/*.dmg ./artifacts/mac-direct/mac-direct-build-$leg/*.zip; do
                  [ -e "$f" ] || continue
                  aws s3 cp "$f" "${DEST}/$(basename "$f")"
                  echo "Uploaded $(basename "$f") → ${DEST}/"
                done ;;
              ad-hoc)
                [ "$dist" = "True" ] || { echo "leg $leg: distribute=false — no S3 upload"; continue; }
                IPA=$(ls ./artifacts/ios/ios-build-$leg/*.ipa 2>/dev/null | head -1 || true)
                [ -n "$IPA" ] || { echo "::error::No .ipa for leg $leg"; exit 1; }
                DEST="${S3_DISTRIBUTION_PATH%/}/${bid}/alpha/${LABEL}"
                BASE="${S3_DOWNLOAD_URL%/}/${bid}/alpha/${LABEL}"
                .shared-ci/.github/scripts/manifest.sh \
                  "${BASE}/app.ipa" "$bid" "$BUILD_NUMBER" "$pname ${LABEL}" > "/tmp/manifest-$leg.plist"
                plutil -lint "/tmp/manifest-$leg.plist"
                aws s3 cp "$IPA" "${DEST}/app.ipa" --content-type "application/octet-stream"
                # text/xml is required: with S3's default application/octet-stream,
                # iOS downloads the manifest but refuses to read it.
                aws s3 cp "/tmp/manifest-$leg.plist" "${DEST}/manifest.plist" --content-type "text/xml"
                echo "Install link: itms-services://?action=download-manifest&url=${BASE}/manifest.plist" ;;
            esac
          done < /tmp/legs.tsv

      # The tag is the durable record + counter source. It does NOT create a GH
      # Release. (Your distribute-release.yml MUST exclude `*-alpha.*`.)
      - name: Push alpha tag
        if: env.ALPHA_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ALPHA_TAG" -m "Alpha ${ALPHA_TAG}"
          git push origin "$ALPHA_TAG"
          echo "Pushed tag $ALPHA_TAG"

      - name: Write alpha build summary
        shell: bash
        env:
          S3_DOWNLOAD_URL: ${{ vars.S3_DOWNLOAD_URL }}
        run: |
          {
            echo "## Alpha build ready 🧪"
            echo
            echo "Private build — **not** on the appcast, in the changelog, in a GitHub Release, or available to external testers."
            echo
            echo "**Version:** \`${LABEL}\` · **Build:** \`${BUILD_NUMBER}\` · **Tag:** \`${ALPHA_TAG:-none}\` · **Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "| Product | Platform | Where |"
            echo "|---|---|---|"
            while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub kind; do
              case "$chan" in
                direct)
                  BASE="${S3_DOWNLOAD_URL}${sub:+/$sub}/alpha/${LABEL}"
                  where="[DMG](${BASE}/${pname}_${LABEL}.dmg) · [ZIP](${BASE}/${pname}_${LABEL}.zip)" ;;
                ad-hoc)
                  where="itms-services://?action=download-manifest&url=${S3_DOWNLOAD_URL%/}/${bid}/alpha/${LABEL}/manifest.plist" ;;
                *)
                  where="TestFlight, internal testers only" ;;
              esac
              echo "| ${pname} | ${plat} | ${where} |"
            done < /tmp/legs.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/legs.tsv /tmp/manifest-*.plist
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
