# ── Internal Build Callee — Mac, Direct (Developer ID) ───────────────────────
# Produces a notarized, stapled .app packaged as DMG + ZIP, uploaded as a
# GitHub Actions workflow artifact (named by the artifact-name input; default
# "mac-direct-build"). An orchestrator (distribute-pr/distribute/release/alpha)
# downloads the artifact and decides what to do with it (S3, appcast, GH release).
#
# The actual build/sign/notarize/package logic lives in the shared script
# `.github/scripts/build-direct.sh` (the single source of truth — also run
# directly by `scripts/build-local.sh` for local builds). This workflow checks
# workflows-macos out into `.shared-ci/` at the same commit (via
# job.workflow_sha) and calls ONE phase of that script per named step,
# so the Actions UI keeps its per-step names, timings, and pass/fail icons.
#
# Provisioning profiles come from App Store Connect: the first step downloads
# every Developer ID profile of the team, and the app and each of its
# extensions are signed with the profile for their own bundle ID. No profile
# is stored in GitHub and none is named anywhere.
#
# Each secret reaches only the steps that use it: the certificate the signing
# step, the App Store Connect key the profile and notarization steps.
#
# Underscore prefix marks this as an internal callee — per-app shells should
# call the distribute-*.yml orchestrators, not this file directly.
#
# Required caller secrets:
#   DEVELOPER_ID_P12_BASE64  — Developer ID Application cert + private key
#   DEVELOPER_ID_PASSWORD    — password for the Developer ID p12
#   KEYCHAIN_PASSWORD        — ephemeral build keychain password
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64  — App Store Connect API key:
#                              downloads the profiles, notarizes the app
#
# Required caller inputs (identity comes from the caller's product list):
#   scheme-name, product-name
#
# Optional:
#   SHARED_WORKFLOWS_TOKEN   → only when consuming a PRIVATE fork of workflows-macos
#                              (the shared-scripts checkout falls back to github.token)
# ─────────────────────────────────────────────────────────────────────────────
name: _build-mac-direct

on:
  workflow_call:
    inputs:
      # ── Required ───────────────────────────────────────────────────────────
      version:
        description: "Marketing version (CFBundleShortVersionString)"
        required: true
        type: string
      build-number:
        description: "Build number (CFBundleVersion), timestamp-based"
        required: true
        type: string
      artifact-label:
        description: "Label for artifact filenames (e.g. '1.3.0' or 'v1.3.0-beta.2')"
        required: true
        type: string

      # ── Product identity (supplied by the caller's product list) ───────────
      scheme-name:
        description: "Xcode scheme to archive."
        required: true
        type: string
      product-name:
        description: "Product name — drives the .app name and the DMG/ZIP filenames."
        required: true
        type: string
      artifact-name:
        description: "GH Actions artifact name for the DMG+ZIP upload. Suffix per leg to avoid matrix collisions."
        type: string
        default: "mac-direct-build"

      # ── Runner ─────────────────────────────────────────────────────────────
      job-timeout-minutes:
        description: "Ceiling for the whole build job. Raise it for a slow archive; lower it to fail fast. Keep archive-timeout-minutes below it, or the step cap bites first."
        type: number
        default: 60

      archive-timeout-minutes:
        description: "Ceiling for the Archive step alone, so a signing stall fails at a named step instead of eating the job. Must stay under job-timeout-minutes."
        type: number
        default: 30

      runs-on:
        description: "JSON-encoded runner label or array. Defaults to self-hosted macOS; pass a hosted label like macos-26 to override."
        type: string
        default: '["self-hosted","macOS"]'

      # ── Checkout ───────────────────────────────────────────────────────────
      lfs:
        description: "Pull the caller repo's git LFS files on checkout (e.g. an LFS-tracked model). Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded artifacts in a private repo (default 7). A public repo keeps them one day: anyone signed in to GitHub can download them, and the publish job needs them for minutes."
        type: number
        default: 7

      # ── Project type ───────────────────────────────────────────────────────
      use-tuist:
        description: "Project is generated by Tuist (runs tuist install + generate before build)"
        type: boolean
        default: false

      # ── Pre-build hooks (caller-provided) ──────────────────────────────────
      # Asset downloads, codegen, etc. that an app needs ON the build runner
      # before xcodebuild archive. Keeps the shared workflow app-agnostic.
      pre-build-cache-path:
        description: "Path to cache via actions/cache@v5 (e.g. 'MyApp/Models/asset.bin'). Empty = no cache."
        type: string
        default: ""
      pre-build-cache-key:
        description: "Cache key. Required when pre-build-cache-path is set."
        type: string
        default: ""
      pre-build-script:
        description: "Path (relative to caller repo) of a bash script to run before archive. Sees the cache-restored files."
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""

      # ── Build configuration ────────────────────────────────────────────────
      configuration:
        description: "Xcode build configuration to archive (e.g. Release, Release Store). Must match a configuration declared in the caller's .xcodeproj."
        type: string
        default: "Release"

      # ── Escape hatch ───────────────────────────────────────────────────────
      extra-xcodebuild-args:
        description: "Additional xcodebuild settings appended to archive command (e.g. 'BUILD_RELEASE_DATE=...')"
        type: string
        default: ""

    # Secrets must be declared (not just inherited) when the originating
    # caller of the reusable-workflow chain is in a different org than this
    # repo — `secrets: inherit` is org-scoped against the OUTERMOST caller,
    # not the immediate caller, so it refuses at every hop in the chain
    # when the chain crosses an org boundary anywhere.
    secrets:
      DEVELOPER_ID_P12_BASE64:        { required: true }
      DEVELOPER_ID_PASSWORD:          { required: true }
      KEYCHAIN_PASSWORD:              { required: true }
      ASC_KEY_ID:                     { required: true }
      ASC_ISSUER_ID:                  { required: true }
      ASC_KEY_BASE64:                 { required: true }
      # Only needed when the originating caller consumes a PRIVATE fork of
      # workflows-macos; the shared-scripts checkout falls back to github.token.
      SHARED_WORKFLOWS_TOKEN:         { required: false }

permissions:
  contents: read

jobs:
  build:
    # `vars.RUNS_ON_BUILD_MAC_DIRECT` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_BUILD_MAC_DIRECT || fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}

    # Set once at the job level; every build-direct.sh phase reads these. The
    # script reconstructs all paths from this env, so each step (a separate
    # process) needs no state from the previous one. No secrets here: a job-level
    # secret would reach the app's own pre-build script and the Tuist installer.
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      ARTIFACT_LABEL: ${{ inputs.artifact-label }}
      SCHEME_NAME: ${{ inputs.scheme-name }}
      PRODUCT_NAME: ${{ inputs.product-name }}
      USE_TUIST: ${{ inputs.use-tuist }}
      CONFIGURATION: ${{ inputs.configuration }}
      EXTRA_ARGS: ${{ inputs.extra-xcodebuild-args }}
      WORK_DIR: /tmp/build/_work
      OUTPUT_DIR: /tmp/build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: ${{ inputs.lfs }}

      # workflows-macos itself (this repo) — pinned to the SAME commit as this
      # reusable workflow, so build-direct.sh can never skew from the YAML.
      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      # Before any of the app's code runs (Tuist, SwiftPM plugins, the pre-build
      # script), so none of it ever runs next to the App Store Connect key.
      - name: Download provisioning profiles
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bash .shared-ci/.github/scripts/build-direct.sh profiles

      - name: Resolve dependencies
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh setup

      # ── Pre-build hooks (caller-provided) — kept as native steps so
      #    actions/cache works and the script stays app-agnostic ──
      - name: Pre-build cache
        if: inputs.pre-build-cache-path != ''
        uses: actions/cache@v5
        with:
          path: ${{ inputs.pre-build-cache-path }}
          key: ${{ inputs.pre-build-cache-key }}

      - name: Pre-build script
        if: inputs.pre-build-script != ''
        shell: bash
        run: bash "${{ inputs.pre-build-script }}"

      - name: Set up signing
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .shared-ci/.github/scripts/build-direct.sh signing

      - name: Archive
        # Bounded so a signing stall fails in minutes with a diagnosable step
        # rather than wedging until the 60-minute job timeout (see #9).
        timeout-minutes: ${{ inputs.archive-timeout-minutes }}
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh archive

      # One phase ↔ one step: build-direct.sh owns the logic (see phase_post_build).
      - name: Post-build script
        if: inputs.post-build-script != ''
        shell: bash
        env:
          POST_BUILD_SCRIPT: ${{ inputs.post-build-script }}
        run: bash .shared-ci/.github/scripts/build-direct.sh post-build

      - name: Export
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh export

      - name: Notarize
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bash .shared-ci/.github/scripts/build-direct.sh notarize

      - name: Staple
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh staple

      - name: Verify (pre-package)
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh verify

      - name: Create DMG and ZIP
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh package

      - name: Verify packaged DMG and ZIP
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh verify-packages

      - name: Upload DMG + ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            /tmp/build/*.dmg
            /tmp/build/*.zip
          if-no-files-found: error
          retention-days: ${{ github.event.repository.private == false && 1 || inputs.artifact-retention-days }}

      - name: Cleanup
        if: always()
        shell: bash
        run: bash .shared-ci/.github/scripts/build-direct.sh cleanup
