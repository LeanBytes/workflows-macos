# ── Distribution Orchestrator ────────────────────────────────────────────────
# Called from a per-app shell on every push to main (and by hand, with a force
# checkbox). `push: branches: [main]` is a trusted base-branch event, so GitHub
# passes secrets + vars (unlike a fork's `pull_request: closed`).
#
# Products are DISCOVERED from Config/products/<id>.json. `products.py plan`
# expands each into one LEG per platform and channel and picks what builds: a
# product builds only when its version is unreleased AND it changed — since its
# last -beta.N tag when it has a Direct leg, since the last successful run of
# this workflow on main when it hasn't (so a failed run is picked up by the
# next push).
#
#   * App Store legs (iPhone, iPad, Mac) go to TestFlight. No tag, no release:
#     the build tested in TestFlight is the build you submit in App Store
#     Connect.
#   * Ad Hoc legs (iPhone, iPad) put an IPA + manifest on S3, live at once.
#   * Direct legs (Mac) go to S3 and the Sparkle beta feed, and the product
#     pushes its own `<prefix><ver>-beta.N` tag + a pre-release.
#
# Strict fail-safe publish order (in publish), across the legs:
#   1. altool → App Store Connect for every app-store leg  ← GATE 1
#   2. S3 upload of every Ad Hoc IPA + manifest
#   3. S3 upload of DMG/ZIP for every Direct leg            (silent)
#   4. Beta appcast update for every appcast leg            ← MAKES BETA VISIBLE
#   5. Per Direct product: push its -beta.N tag + a pre-release (assets attached)
#
# `[skip ci]` in a commit message skips the run entirely (GitHub-native).
#
# Per-app shell (trigger-only; the full one is examples/per-app/distribute.yml):
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#       inputs:
#         force: { description: "Build even if nothing changed", type: boolean, default: false }
#   jobs:
#     distribute:
#       uses: LeanBytes/workflows-macos/.github/workflows/distribute.yml@v0.6.1
#       with:
#         force: ${{ inputs.force || false }}
#       secrets:
#         # …
# ─────────────────────────────────────────────────────────────────────────────
name: distribute

on:
  workflow_call:
    inputs:
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"
      force:
        description: "Build even when nothing changed — a re-cut after a flaky runner, a toolchain or dependency change, a TestFlight build about to expire. Has NO effect on a product whose version is already released: forcing overrides 'nothing changed', not 'already shipped'. Meant for a workflow_dispatch checkbox in the caller's shell."
        type: boolean
        default: false
      use-tuist:
        type: boolean
        default: false
      pre-build-cache-path:
        type: string
        default: ""
      pre-build-cache-key:
        type: string
        default: ""
      pre-build-script:
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""
      extra-xcodebuild-args:
        type: string
        default: ""
      runs-on-prepare:
        description: "Runner for the prepare job (plans what builds). Runs FIRST and every other job needs it, so a repo with no self-hosted Mac must point this at a hosted image too."
        type: string
        default: '["self-hosted","macOS"]'
      build-timeout-minutes:
        description: "Ceiling for each build job. Forwarded to the build callees."
        type: number
        default: 60
      archive-timeout-minutes:
        description: "Ceiling for the Archive step inside each build job. Must stay under build-timeout-minutes."
        type: number
        default: 30
      runs-on-build-ios:
        description: "Runner for the iPhone and iPad archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-build-mac-store:
        description: "Runner for the Mac App Store archive. Must be a released Xcode — altool rejects a bundle whose Info.plist records a beta (error 90301), and that keys off the archiving Xcode, not the uploader."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-build-mac-direct:
        description: "Runner for the Developer ID (Direct) archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-test:
        description: "Runner for the test job."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-publish:
        description: "Publish job needs macOS for altool + Sparkle generate_appcast"
        type: string
        default: '["self-hosted","macOS"]'
      lfs:
        description: "Pull the caller repo's git LFS files on build checkouts. Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded build/test artifacts in a private repo (default 7; a public repo keeps build artifacts one day). They're consumed within the run, so this is mostly for post-hoc debugging."
        type: number
        default: 7
      attach-release-assets:
        description: "Attach a Direct build's DMG/ZIP to its GitHub pre-release. Default true. Set false to save GitHub storage/bandwidth — the DMG/ZIP still upload to S3 (the real distribution) and the appcast points there; only the redundant GitHub copy is skipped."
        type: boolean
        default: true

      # ── Tests (opt-in) — gate the build on the app's Swift tests ───────────
      run-tests:
        description: "Run tests before building; if they fail, nothing is built or published and a Jira ticket is filed."
        type: boolean
        default: false
      test-runner:
        description: "xcodebuild | swift | both."
        type: string
        default: "xcodebuild"
      test-scheme:
        description: "Scheme for xcodebuild tests. Defaults to the first discovered product's scheme."
        type: string
        default: ""
      test-plan:
        type: string
        default: ""
      test-destination:
        description: "xcodebuild -destination for the test run. Defaults to the Mac when the first product has a Mac leg, else an iOS Simulator."
        type: string
        default: ""
      xcodebuild-test-args:
        type: string
        default: ""
      app-name:
        description: "App name for tests. Defaults to the first discovered product's product-name."
        type: string
        default: ""
      swift-package-path:
        type: string
        default: "."
      swift-test-filter:
        type: string
        default: ""
      coverage-min:
        type: string
        default: ""
    secrets:
      APPLE_DISTR_P12_BASE64:         { required: false }
      APPLE_DISTR_PASSWORD:           { required: false }
      MAC_DISTR_P12_BASE64:           { required: false }
      MAC_DISTR_PASSWORD:             { required: false }
      DEVELOPER_ID_P12_BASE64:        { required: false }
      DEVELOPER_ID_PASSWORD:          { required: false }
      # A leg can sign with another certificate (e.g. a legacy team kept after
      # an account transfer) by naming these in "cert-secret" /
      # "cert-password-secret". Unset falls back to the team's own.
      APPLE_DISTR_P12_ALT_BASE64:     { required: false }
      APPLE_DISTR_PASSWORD_ALT:       { required: false }
      DEVELOPER_ID_P12_ALT_BASE64:    { required: false }
      DEVELOPER_ID_PASSWORD_ALT:      { required: false }
      KEYCHAIN_PASSWORD:              { required: false }
      ASC_KEY_ID:                     { required: false }
      ASC_ISSUER_ID:                  { required: false }
      ASC_KEY_BASE64:                 { required: false }
      AWS_ACCESS_KEY_ID:              { required: false }
      AWS_SECRET_ACCESS_KEY:          { required: false }
      SPARKLE_ED_PRIVATE_KEY:         { required: false }
      JIRA_API_TOKEN:                 { required: false }
      SHARED_WORKFLOWS_TOKEN:         { required: false }

permissions:
  contents: write          # push Direct beta tags + create their pre-releases
  actions: read            # find the last successful run (the reference for untagged products)

# Repo-wide, never cancelled: two racing pushes would otherwise both diff
# against the same last beta tag and ship the same change twice.
concurrency:
  group: distribute-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    # `vars.RUNS_ON_PREPARE` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PREPARE || fromJSON(inputs.runs-on-prepare) }}
    timeout-minutes: 5
    outputs:
      products: ${{ steps.plan.outputs.products }}
      legs: ${{ steps.plan.outputs.legs }}
      ios-legs: ${{ steps.plan.outputs.ios-legs }}
      mac-store-legs: ${{ steps.plan.outputs.mac-store-legs }}
      mac-direct-legs: ${{ steps.plan.outputs.mac-direct-legs }}
      has-ios: ${{ steps.plan.outputs.has-ios }}
      has-mac-store: ${{ steps.plan.outputs.has-mac-store }}
      has-mac-direct: ${{ steps.plan.outputs.has-mac-direct }}
      has-appcast: ${{ steps.plan.outputs.has-appcast }}
      has-any: ${{ steps.plan.outputs.has-any }}
      build-number: ${{ steps.plan.outputs.build-number }}
      test-scheme: ${{ steps.plan.outputs.test-scheme }}
      test-app-name: ${{ steps.plan.outputs.test-app-name }}
      test-destination: ${{ steps.plan.outputs.test-destination }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history + tags for the change check
          fetch-tags: true

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      # A product without a Direct leg has no tags to compare against, so it
      # compares against the commit the last successful run of this workflow on
      # main built from. Not the push's own `before`: a run that failed, a
      # [skip ci] push, or a queued run GitHub cancelled for a newer one would
      # then lose its changes for good. Without `actions: read` in the caller's
      # shell the API answers 403, and the push's `before` is the fallback.
      - name: Find the last successful run
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          wf="${GITHUB_WORKFLOW_REF%@*}"; wf="${wf#*/.github/workflows/}"
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=1" \
                     --jq '.workflow_runs[0].head_sha // ""'); then
            echo "Last successful run of $wf on main built: ${sha:-nothing yet}"
          else
            echo "::warning::Could not list the runs of $wf — add 'actions: read' to the shell's permissions. Comparing against the push's previous commit instead, which loses the changes of a failed or skipped run."
            sha="$BEFORE"
          fi
          echo "since=$sha" >> "$GITHUB_OUTPUT"

      - name: Plan builds
        id: plan
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
          SINCE: ${{ steps.since.outputs.since }}
          # `*` = every discovered product. Off renders to "", which products.py
          # treats as UNSET — the `if inj:` there is load-bearing: under an
          # `is not None` test an empty value would mean "nothing changed" and
          # silently stop every build on every normal push.
          ASSUME_CHANGED: ${{ inputs.force && '*' || '' }}
        run: python3 .shared-ci/.github/scripts/products.py plan >> "$GITHUB_OUTPUT"

      - name: Show what builds
        run: |
          echo "has-any = ${{ steps.plan.outputs.has-any }}"
          echo '${{ steps.plan.outputs.legs }}' | python3 -m json.tool || echo "(empty)"

  # ── Tests (opt-in) — gate before build/publish ───────────────────────────
  test:
    if: inputs.run-tests
    needs: prepare
    uses: LeanBytes/workflows-macos/.github/workflows/_test.yml@v0.6.1
    with:
      test-runner: ${{ inputs.test-runner }}
      runs-on: ${{ inputs.runs-on-test }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      test-scheme: ${{ inputs.test-scheme != '' && inputs.test-scheme || needs.prepare.outputs.test-scheme }}
      test-plan: ${{ inputs.test-plan }}
      test-destination: ${{ inputs.test-destination != '' && inputs.test-destination || needs.prepare.outputs.test-destination }}
      use-tuist: ${{ inputs.use-tuist }}
      xcodebuild-test-args: ${{ inputs.xcodebuild-test-args }}
      app-name: ${{ inputs.app-name != '' && inputs.app-name || needs.prepare.outputs.test-app-name }}
      swift-package-path: ${{ inputs.swift-package-path }}
      swift-test-filter: ${{ inputs.swift-test-filter }}
      coverage-min: ${{ inputs.coverage-min }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      file-jira-on-failure: true
      gate-on-new-commit: false
    secrets:
      JIRA_API_TOKEN:         ${{ secrets.JIRA_API_TOKEN }}
      SHARED_WORKFLOWS_TOKEN: ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  # One build job per callee. A job `if:` cannot read `matrix`, and an empty
  # matrix throws rather than skipping — so each gates on its presence boolean.
  build-ios:
    if: ${{ always() && needs.prepare.result == 'success' && needs.test.result != 'failure' && needs.prepare.outputs.has-ios == 'true' }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.ios-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-ios.yml@v0.6.1
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}                 # bare X.Y.Z — ASC rejects suffixes
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-name: ios-build-${{ matrix.leg.leg }}
      scheme: ${{ matrix.leg.scheme }}
      configuration: ${{ matrix.leg.configuration }}
      profile-type: ${{ matrix.leg.profile-type }}
      export-method: ${{ matrix.leg.export-method }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-ios }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64:  ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:    ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  build-mac-store:
    if: ${{ always() && needs.prepare.result == 'success' && needs.test.result != 'failure' && needs.prepare.outputs.has-mac-store == 'true' }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.mac-store-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-mac-store.yml@v0.6.1
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}                 # bare X.Y.Z — ASC rejects suffixes
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-name: mac-store-build-${{ matrix.leg.leg }}
      scheme: ${{ matrix.leg.scheme }}
      configuration: ${{ matrix.leg.configuration }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-mac-store }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64:  ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:    ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      MAC_DISTR_P12_BASE64:    ${{ secrets.MAC_DISTR_P12_BASE64 }}
      MAC_DISTR_PASSWORD:      ${{ secrets.MAC_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  build-mac-direct:
    if: ${{ always() && needs.prepare.result == 'success' && needs.test.result != 'failure' && needs.prepare.outputs.has-mac-direct == 'true' }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.mac-direct-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-mac-direct.yml@v0.6.1
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}                 # e.g. "2.14.0-beta.5"
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-label: ${{ matrix.leg.artifact-label }}
      artifact-name: mac-direct-build-${{ matrix.leg.leg }}
      scheme-name: ${{ matrix.leg.scheme }}
      product-name: ${{ matrix.leg.product-name }}
      configuration: ${{ matrix.leg.configuration }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-mac-direct }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:   ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  publish:
    needs: [prepare, test, build-ios, build-mac-store, build-mac-direct]
    # 'skipped' must stay permitted — a product without a leg of some kind
    # legitimately skips that build job — but 'cancelled' must not: a wedged or
    # evicted build job would otherwise publish half a release, pushing the tag
    # and burning the counter with one leg silently missing (see #10).
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.test.result != 'failure' &&
      needs.build-ios.result != 'failure' && needs.build-ios.result != 'cancelled' &&
      needs.build-mac-store.result != 'failure' && needs.build-mac-store.result != 'cancelled' &&
      needs.build-mac-direct.result != 'failure' && needs.build-mac-direct.result != 'cancelled' &&
      (needs.build-ios.result == 'success' || needs.build-mac-store.result == 'success' || needs.build-mac-direct.result == 'success')
    # `vars.RUNS_ON_PUBLISH` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PUBLISH || fromJSON(inputs.runs-on-publish) }}
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      LEGS_JSON: ${{ needs.prepare.outputs.legs }}
      PRODUCTS_JSON: ${{ needs.prepare.outputs.products }}
      PRODUCTS_DIR: ${{ inputs.products-dir }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ATTACH_ASSETS: ${{ inputs.attach-release-assets }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Download ios-build artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: ios-build-*
          path: ./artifacts/ios

      - name: Download mac-store-build artifacts
        if: needs.build-mac-store.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mac-store-build-*
          path: ./artifacts/mac-store

      - name: Download mac-direct-build artifacts
        if: needs.build-mac-direct.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: mac-direct-build-*
          path: ./artifacts/mac-direct

      # Expand legs and products into \x1f-delimited tables (NOT tab — tab is
      # IFS-whitespace and `read` would collapse an empty s3-subpath, shifting
      # every later column).
      #   legs.tsv:     leg id pname plat chan dist bid sub afile aseed acast label mkt kind
      #   products.tsv: id pname ver rtag
      - name: Expand legs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$LEGS_JSON" "$PRODUCTS_JSON" <<'PY'
          import json, sys
          KIND = {("ios", "app-store"): "ios", ("ios", "ad-hoc"): "ios",
                  ("macos", "app-store"): "mac-store", ("macos", "direct"): "mac-direct"}
          fields = ["leg", "id", "product-name", "platform", "channel", "distribute", "bundle-id",
                    "s3-subpath", "appcast-filename", "appcast-seed-path", "appcast",
                    "artifact-label", "marketing"]
          with open("/tmp/legs.tsv", "w") as f:
              for l in json.loads(sys.argv[1]):
                  row = [str(l.get(k, "")) for k in fields] + [KIND[(l["platform"], l["channel"])]]
                  f.write("\x1f".join(row) + "\n")
          with open("/tmp/products.tsv", "w") as f:
              for p in json.loads(sys.argv[2]):
                  f.write("\x1f".join(str(p.get(k, "")) for k in ("id", "product-name", "version", "release-tag")) + "\n")
          PY
          echo "Legs:"; tr '\037' '\t' < /tmp/legs.tsv

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          # actions/download-artifact extracts a LONE matched artifact flat into
          # the base path (no per-artifact subdir); multiple matches DO get subdirs
          # (merge-multiple defaults false). Re-nest a flattened artifact so the
          # per-leg globs below can always assume artifacts/<kind>/<kind>-build-<leg>/
          # — otherwise a single-leg run finds "No .ipa / no .pkg / no DMG".
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
            base="./artifacts/$kind"; want="$base/$kind-build-$leg"
            if [ -d "$base" ] && [ ! -d "$want" ] && [ -n "$(find "$base" -maxdepth 1 -type f 2>/dev/null)" ]; then
              mkdir -p "$want"
              find "$base" -maxdepth 1 -type f -exec mv {} "$want"/ \;
              echo "re-nested flattened $kind artifact → $want/"
            fi
          done < /tmp/legs.tsv

      # ── Release notes: each product's own inline changelog (versions[0]) ──
      - name: Read release notes (per product)
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r id pname ver rtag; do
            CHANGELOG_PATH="${PRODUCTS_DIR}/$id.json" VERSION="NEXT" \
              .shared-ci/.github/scripts/changelog-from-json.sh > "/tmp/notes-$id.md" || true
          done < /tmp/products.tsv

      # ── GATE 1: TestFlight upload (every app-store leg, iPhone and Mac) ───
      - name: Upload to TestFlight (per app-store leg)
        if: needs.build-ios.result == 'success' || needs.build-mac-store.result == 'success'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -uo pipefail
          source .shared-ci/.github/scripts/classify-upload.sh
          # altool reads the key from here; Cleanup removes it.
          mkdir -p ~/.appstoreconnect/private_keys
          (umask 077; echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8)
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
            [ "$chan" = "app-store" ] || continue
            [ "$dist" = "True" ] || { echo "leg $leg: distribute=false — skipping upload"; continue; }
            echo "::group::TestFlight upload — $leg"
            if [ "$plat" = "ios" ]; then ext=ipa; type=ios; else ext=pkg; type=macos; fi
            FILE=$(ls ./artifacts/$kind/$kind-build-$leg/*.$ext 2>/dev/null | head -1 || true)
            if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
              echo "::error::No .$ext for leg $leg"; echo "::endgroup::"; exit 1
            fi
            # errexit off around the capture: a non-zero altool exit must reach
            # the classifier below, not abort the step.
            set +e
            OUTPUT=$(xcrun altool --upload-app --type "$type" --file "$FILE" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            RC=$?
            set -e
            echo "$OUTPUT"
            case "$(classify_upload "$RC" "$OUTPUT")" in
              accepted)        echo "TestFlight upload accepted for $leg"; echo "::endgroup::"; continue ;;
              already-present) echo "Build for $leg already present — treating as success."; echo "::endgroup::"; continue ;;
            esac
            echo "::error::altool failed for $leg (exit ${RC})"; echo "::endgroup::"; exit 1
          done < /tmp/legs.tsv

      - name: Install AWS CLI
        if: needs.build-mac-direct.result == 'success' || contains(needs.prepare.outputs.ios-legs, '"channel":"ad-hoc"')
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws &>/dev/null; then
            curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
            sudo installer -pkg /tmp/AWSCLIV2.pkg -target /
            rm -f /tmp/AWSCLIV2.pkg
          fi
          aws --version

      # ── Ad Hoc: IPA + manifest.plist to S3, live at once ──────────────────
      # Same standing as the altool upload: if it fails, nothing is tagged. The
      # location is deliberately STABLE (<dist>/<bundle-id>/app.ipa), so the
      # itms-services link on the install page stays the same across versions.
      - name: Upload IPA + manifest to S3 (per ad-hoc leg)
        if: contains(needs.prepare.outputs.ios-legs, '"channel":"ad-hoc"')
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
          S3_DOWNLOAD_URL: ${{ vars.S3_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
            [ "$chan" = "ad-hoc" ] || continue
            [ "$dist" = "True" ] || { echo "leg $leg: distribute=false — no S3 upload"; continue; }
            if [ -z "${S3_DISTRIBUTION_PATH:-}" ] || [ -z "${S3_DOWNLOAD_URL:-}" ]; then
              echo "::error::The Ad Hoc channel needs the S3_DISTRIBUTION_PATH and S3_DOWNLOAD_URL variables."
              exit 1
            fi
            echo "::group::S3 upload (Ad Hoc) — $leg"
            IPA=$(ls ./artifacts/ios/ios-build-$leg/*.ipa 2>/dev/null | head -1 || true)
            if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
              echo "::error::No .ipa for leg $leg"; echo "::endgroup::"; exit 1
            fi
            DEST="${S3_DISTRIBUTION_PATH%/}/${bid}"
            BASE="${S3_DOWNLOAD_URL%/}/${bid}"
            # The build number is the monotonic timestamp, which is what iOS
            # reads to recognise an update — not the marketing version.
            .shared-ci/.github/scripts/manifest.sh \
              "${BASE}/app.ipa" "$bid" "$BUILD_NUMBER" "$pname" > "/tmp/manifest-$leg.plist"
            plutil -lint "/tmp/manifest-$leg.plist"
            aws s3 cp "$IPA" "${DEST}/app.ipa" --content-type "application/octet-stream"
            # text/xml is required: with S3's default application/octet-stream,
            # iOS downloads the manifest but refuses to read it.
            aws s3 cp "/tmp/manifest-$leg.plist" "${DEST}/manifest.plist" --content-type "text/xml"
            echo "Install link: itms-services://?action=download-manifest&url=${BASE}/manifest.plist"
            echo "::endgroup::"
          done < /tmp/legs.tsv

      # ── Direct: DMG/ZIP to S3 (still silent — the appcast hasn't moved) ───
      - name: Upload DMG + ZIP to S3 (per direct leg)
        if: needs.build-mac-direct.result == 'success'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
            [ "$chan" = "direct" ] || continue
            echo "::group::S3 upload — $leg"
            DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}"
            for f in ./artifacts/mac-direct/mac-direct-build-$leg/*.dmg ./artifacts/mac-direct/mac-direct-build-$leg/*.zip; do
              [ -e "$f" ] || continue
              aws s3 cp "$f" "${DEST}/$(basename "$f")"
              echo "Uploaded $(basename "$f") → ${DEST}/"
            done
            echo "::endgroup::"
          done < /tmp/legs.tsv

      # ── GATE 2: Beta appcast update (per direct leg) ───────────────────────
      - name: Download Sparkle
        if: needs.prepare.outputs.has-appcast == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SPARKLE_TAG=$(gh api /repos/sparkle-project/Sparkle/releases/latest --jq '.tag_name')
          echo "Sparkle version: ${SPARKLE_TAG}"
          curl -fL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TAG}/Sparkle-${SPARKLE_TAG}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          chmod +x /tmp/sparkle/bin/generate_appcast

      - name: Update Sparkle beta appcast (per direct leg)
        if: needs.prepare.outputs.has-appcast == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
            { [ "$chan" = "direct" ] && [ "$acast" = "True" ]; } || continue
            echo "::group::Beta appcast — $leg"
            WORK="/tmp/appcast-$id"
            rm -rf "$WORK"; mkdir -p "$WORK"   # LB-459: start clean (persistent self-hosted /tmp)
            cp ./artifacts/mac-direct/mac-direct-build-$leg/*.zip "$WORK"/
            DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}"
            if aws s3 cp "${DEST}/${afile}" "${WORK}/${afile}"; then
              echo "Downloaded existing ${afile}"
            else
              echo "No ${afile} on S3, seeding from ${aseed}"
              cp "${aseed}" "${WORK}/${afile}"
            fi
            echo "$SPARKLE_ED_PRIVATE_KEY" | /tmp/sparkle/bin/generate_appcast --ed-key-file - --channel beta "${WORK}/"
            # Match by build number — beta items repeat marketing version across merges.
            NOTES=""
            [ -f "/tmp/notes-$id.md" ] && NOTES=$(cat "/tmp/notes-$id.md")
            VERSION="$BUILD_NUMBER" NOTES="$NOTES" APPCAST_PATH="${WORK}/${afile}" \
              .shared-ci/.github/scripts/update-appcast.sh
            aws s3 cp "${WORK}/${afile}" "${DEST}/${afile}" --content-type "application/xml"
            echo "Uploaded ${afile} → ${DEST}/ (beta live for $id)"
            echo "::endgroup::"
          done < /tmp/legs.tsv

      # ── Per Direct product: push its beta tag + pre-release (+ its assets) ─
      # LAST, so a failed upload never leaves a tag claiming the build shipped.
      # App Store and Ad Hoc builds get no tag: a tag marks a build that reaches
      # customers on its own, and a TestFlight upload doesn't.
      - name: Push beta tag + create pre-release (per direct product)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\x1f' read -r id pname ver rtag; do
            [ -n "$rtag" ] || continue
            echo "::group::publish $id → $rtag"
            if git rev-parse "refs/tags/$rtag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$rtag" >/dev/null 2>&1; then
              echo "tag $rtag already exists — skipping (idempotent re-run)"; echo "::endgroup::"; continue
            fi
            git tag -a "$rtag" -m "Beta $rtag"
            git push origin "$rtag"
            NOTES_ARG=(--notes "Beta $rtag ($pname)")
            if [ -f "/tmp/notes-$id.md" ] && [ -s "/tmp/notes-$id.md" ]; then
              NOTES_ARG=(--notes-file "/tmp/notes-$id.md")
            fi
            gh release create "$rtag" --repo "$REPO" --title "$rtag" --prerelease "${NOTES_ARG[@]}"
            if [ "$ATTACH_ASSETS" = "true" ]; then
              shopt -s nullglob
              ASSETS=( ./artifacts/mac-direct/mac-direct-build-$id-macos-direct/*.dmg ./artifacts/mac-direct/mac-direct-build-$id-macos-direct/*.zip )
              shopt -u nullglob
              [ ${#ASSETS[@]} -gt 0 ] && gh release upload "$rtag" --repo "$REPO" --clobber "${ASSETS[@]}"
            fi
            echo "pushed $rtag + pre-release ✅"; echo "::endgroup::"
          done < /tmp/products.tsv

      # ── Run summary ────────────────────────────────────────────────────────
      - name: Write summary
        shell: bash
        env:
          S3_DOWNLOAD_URL: ${{ vars.S3_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Built ✅  (build \`${BUILD_NUMBER}\`)"
            echo
            echo "| Product | Platform | Version | Where |"
            echo "|---|---|---|---|"
            testflight=
            while IFS=$'\x1f' read -r leg id pname plat chan dist bid sub afile aseed acast label mkt kind; do
              if [ "$chan" = "direct" ]; then
                BASE="${S3_DOWNLOAD_URL}${sub:+/$sub}"
                where="Direct: [DMG](${BASE}/${pname}_${label}.dmg) · [ZIP](${BASE}/${pname}_${label}.zip)"
              elif [ "$dist" != "True" ]; then
                where="built, not distributed"
              elif [ "$chan" = "ad-hoc" ]; then
                where="Ad Hoc (S3), live"
              else
                where="TestFlight"; testflight=1
              fi
              echo "| ${pname} | ${plat} | ${mkt} | ${where} |"
            done < /tmp/legs.tsv
            if [ -n "$testflight" ]; then
              echo
              echo "To ship a TestFlight build: in App Store Connect, add build \`${BUILD_NUMBER}\` to the"
              echo "version and submit it for review. Once it is approved, bump the product's changelog version."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/sparkle /tmp/sparkle.tar.xz /tmp/appcast-* /tmp/notes-*.md /tmp/manifest-*.plist /tmp/legs.tsv /tmp/products.tsv
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
