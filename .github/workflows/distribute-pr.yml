# ── PR Distribution Orchestrator ─────────────────────────────────────────────
# Lightweight PR check: discover every Config/products/<id>.json and compile
# each one (fan-out matrix), so a change that breaks any product is caught
# before merge. No signing, no notarization, no S3, no artifacts.
#
# v0.4.0: products are DISCOVERED from Config/products/*.json (self-contained
# per-product files), not passed as an input. Discovery-by-glob is fork-PR safe
# — GitHub strips secrets AND vars from fork-PR runs, but the product files ship
# with the checkout. The per-app shell is trigger-only.
#
# Per-app shell:
#
#   on:
#     pull_request:
#       types: [opened, synchronize]
#   jobs:
#     pr:
#       uses: LeanBytes/workflows-macos/.github/workflows/distribute-pr.yml@v0.5.7
# ─────────────────────────────────────────────────────────────────────────────
name: distribute-pr

on:
  workflow_call:
    inputs:
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"

      use-tuist:
        description: "Project is generated by Tuist (runs tuist install + generate before build)"
        type: boolean
        default: false

      pre-build-cache-path:
        description: "Path to cache via actions/cache@v5. Empty = no cache."
        type: string
        default: ""
      pre-build-cache-key:
        description: "Cache key. Required when pre-build-cache-path is set."
        type: string
        default: ""
      pre-build-script:
        description: "Path of a bash script to run before the compile step."
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""

      runs-on-discover:
        description: "Runner for the discover job (globs the product files). Runs FIRST and every other job needs it, so a repo with no self-hosted Mac must point this at a hosted image too."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-build:
        description: "JSON-encoded runner label or array. Defaults to self-hosted macOS; pass macos-26 for a hosted runner."
        type: string
        default: '["self-hosted","macOS"]'

      runs-on-test:
        description: "Runner for the test job. Defaults to self-hosted macOS; pass macos-26 for a hosted runner."
        type: string
        default: '["self-hosted","macOS"]'

      lfs:
        description: "Pull the caller repo's git LFS files on checkout (e.g. an LFS-tracked model). Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded artifacts (default 7). Passed through to the test gate. Raise it per app if you need longer for debugging."
        type: number
        default: 7

      extra-xcodebuild-args:
        description: "Additional xcodebuild settings appended to the build command."
        type: string
        default: ""

      configuration-direct:
        description: "Xcode build configuration for the Direct compile. Default 'Release'."
        type: string
        default: "Release"

      configuration-app-store:
        description: "Xcode build configuration for the App Store compile. Parity with distribute-beta/release — a product whose store leg needs e.g. 'Release Store' must pass it here too, or the PR compiles a flavour that never ships."
        type: string
        default: "Release"

      # ── Tests (opt-in) — run the app's Swift tests on the PR ───────────────
      run-tests:
        description: "Run tests on the PR (red check on failure). Off = compile-only (current behaviour)."
        type: boolean
        default: false
      test-runner:
        description: "xcodebuild | swift | both."
        type: string
        default: "xcodebuild"
      test-scheme:
        description: "Scheme to test. Defaults to the first discovered product's scheme."
        type: string
        default: ""
      test-plan:
        type: string
        default: ""
      xcodebuild-test-args:
        type: string
        default: ""
      app-name:
        type: string
        default: ""
      swift-package-path:
        type: string
        default: "."
      swift-test-filter:
        type: string
        default: ""
      coverage-min:
        type: string
        default: ""

    secrets:
      SHARED_WORKFLOWS_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  # ── Discover + validate every Config/products/<id>.json (cheap, fail-fast) ──
  # products.py validates identity + the mandatory inline changelog and fails
  # loudly on a bad file — so this cheap job gates the expensive verify below.
  # (Ran on ubuntu until v0.4.7 moved every job to self-hosted macOS.)
  discover:
    # `vars.RUNS_ON_DISCOVER` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_DISCOVER || fromJSON(inputs.runs-on-discover) }}
    timeout-minutes: 5
    outputs:
      products: ${{ steps.d.outputs.products }}
      # The per-channel subsets products.py already emits — the same ones
      # distribute-beta matrixes its build jobs over. Only `has-direct` was
      # forwarded before, so the App Store scheme had nothing to fan out from
      # and never compiled on a PR (#21).
      direct-products: ${{ steps.d.outputs.direct-products }}
      store-products: ${{ steps.d.outputs.store-products }}
      has-direct: ${{ steps.d.outputs.has-direct }}
      has-store: ${{ steps.d.outputs.has-store }}
      ids: ${{ steps.d.outputs.ids }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Discover products
        id: d
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
        run: python3 .shared-ci/.github/scripts/products.py discover >> "$GITHUB_OUTPUT"

      - name: Show discovered products
        run: echo "Discovered products - ${{ steps.d.outputs.ids }}"

  # ── Compile verify-direct (Developer ID / Sparkle) ────────────────────────────
  # One leg per product with this channel enabled — the same subsets
  # distribute-beta matrixes its build jobs over, so the PR compiles exactly
  # what the merge will build. products.py validates `scheme` as required
  # for this channel, so the scheme is always present.
  #
  # NOTHING here is conditional. Gating the build on `run-tests` is what made
  # this job an 11-second no-op for every app using the `swift` test runner,
  # whose tests never open the Xcode project (#21). This job and `test` both
  # need only `discover`, so they run in parallel — a duplicate build costs
  # machine minutes, never PR latency.
  verify-direct:
    name: verify-direct / ${{ matrix.product.id }}
    needs: discover
    if: needs.discover.outputs.has-direct == 'true'
    # `vars.RUNS_ON_BUILD` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_BUILD || fromJSON(inputs.runs-on-build) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.discover.outputs.direct-products) }}
    env:
      SCHEME: ${{ matrix.product.scheme }}
      CONFIGURATION: ${{ inputs.configuration-direct }}
      PRODUCT_ID: ${{ matrix.product.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          lfs: ${{ inputs.lfs }}

      - name: Show what is being compiled
        shell: bash
        run: echo "product '$PRODUCT_ID' - scheme '$SCHEME' - configuration '$CONFIGURATION'"

      # ── Tuist (opt-in) ─────────────────────────────────────────────────────
      - name: Install Tuist (via mise)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          # The `brew tap tuist/tuist` cask is broken upstream (invalid
          # `conflicts_with formula:` stanza), so Tuist is installed through mise,
          # via its official one-liner (the method used on the self-hosted runner).
          # mise lands in ~/.local/bin — add it to PATH now and to $GITHUB_PATH so
          # the Fetch/Generate steps below find it. A committed mise.toml pin is
          # honored, else latest. CI sets CI=true so mise auto-trusts the config.
          export PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null 2>&1 || curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install
          mise exec -- tuist --version >/dev/null 2>&1 || mise use tuist@latest

      - name: Fetch Swift package dependencies (Tuist)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: mise exec -- tuist install

      - name: Generate Xcode project (Tuist)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: mise exec -- tuist generate --no-open

      # ── SwiftPM (when not Tuist) ───────────────────────────────────────────
      - name: Resolve Swift package dependencies
        if: ${{ !inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION"

      # ── Pre-build hooks (caller-provided) ──────────────────────────────────
      # Run unconditionally: a pre-build script may generate sources the compile
      # needs. Generic beats optimal — an app whose hook only feeds the tests
      # pays a few seconds here.
      - name: Pre-build cache
        if: ${{ inputs.pre-build-cache-path != '' }}
        uses: actions/cache@v5
        with:
          path: ${{ inputs.pre-build-cache-path }}
          key: ${{ inputs.pre-build-cache-key }}

      - name: Pre-build script
        if: ${{ inputs.pre-build-script != '' }}
        shell: bash
        run: bash "${{ inputs.pre-build-script }}"

      # ── Compile (no signing) ───────────────────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO + CODE_SIGNING_REQUIRED=NO let xcodebuild compile
      # without selecting an identity or provisioning profile, so fork PRs (where
      # GitHub strips secrets) get the same signal as same-repo ones. `build` and
      # not `archive`: building the app scheme already compiles every embedded
      # extension and links the whole bundle, which is the question a PR asks;
      # archiving adds export + packaging, needs secrets a fork cannot have, and
      # buys no extra compile coverage.
      - name: Compile (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            ${{ inputs.extra-xcodebuild-args }}

      # ── Post-build hook (caller-provided) ──────────────────────────────────
      # The compile runs without -derivedDataPath, so the product is in the
      # default DerivedData location — not predictable from here. Read it back
      # from the same scheme/configuration/destination/args the compile used.
      # QUOTE the result: the store leg's configuration is typically
      # "Release Store", so BUILT_PRODUCTS_DIR contains a space, and an
      # unquoted expansion passes on Direct and fails only on the store leg.
      - name: Post-build script
        if: ${{ inputs.post-build-script != '' }}
        shell: bash
        env:
          POST_BUILD_SCRIPT: ${{ inputs.post-build-script }}
        run: |
          set -euo pipefail
          settings=$(xcodebuild -showBuildSettings \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            ${{ inputs.extra-xcodebuild-args }} 2>/dev/null)
          dir=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *BUILT_PRODUCTS_DIR = /{print $2; exit}')
          name=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *FULL_PRODUCT_NAME = /{print $2; exit}')
          [ -n "$dir" ] && [ -n "$name" ] && [ -e "$dir/$name" ] || {
            echo "::error::could not locate the built product for scheme '$SCHEME' (configuration '$CONFIGURATION')"
            exit 1
          }
          echo "Running post-build script on: $dir/$name"
          bash "$POST_BUILD_SCRIPT" "$dir/$name"

  # ── Compile verify-store (App Store / TestFlight) ────────────────────────────
  # One leg per product with this channel enabled — the same subsets
  # distribute-beta matrixes its build jobs over, so the PR compiles exactly
  # what the merge will build. products.py validates `scheme-store` as required
  # for this channel, so the scheme is always present.
  #
  # NOTHING here is conditional. Gating the build on `run-tests` is what made
  # this job an 11-second no-op for every app using the `swift` test runner,
  # whose tests never open the Xcode project (#21). This job and `test` both
  # need only `discover`, so they run in parallel — a duplicate build costs
  # machine minutes, never PR latency.
  verify-store:
    name: verify-store / ${{ matrix.product.id }}
    needs: discover
    if: needs.discover.outputs.has-store == 'true'
    # `vars.RUNS_ON_BUILD` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_BUILD || fromJSON(inputs.runs-on-build) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.discover.outputs.store-products) }}
    env:
      SCHEME: ${{ matrix.product.scheme-store }}
      CONFIGURATION: ${{ inputs.configuration-app-store }}
      PRODUCT_ID: ${{ matrix.product.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          lfs: ${{ inputs.lfs }}

      - name: Show what is being compiled
        shell: bash
        run: echo "product '$PRODUCT_ID' - scheme '$SCHEME' - configuration '$CONFIGURATION'"

      # ── Tuist (opt-in) ─────────────────────────────────────────────────────
      - name: Install Tuist (via mise)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          # The `brew tap tuist/tuist` cask is broken upstream (invalid
          # `conflicts_with formula:` stanza), so Tuist is installed through mise,
          # via its official one-liner (the method used on the self-hosted runner).
          # mise lands in ~/.local/bin — add it to PATH now and to $GITHUB_PATH so
          # the Fetch/Generate steps below find it. A committed mise.toml pin is
          # honored, else latest. CI sets CI=true so mise auto-trusts the config.
          export PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null 2>&1 || curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install
          mise exec -- tuist --version >/dev/null 2>&1 || mise use tuist@latest

      - name: Fetch Swift package dependencies (Tuist)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: mise exec -- tuist install

      - name: Generate Xcode project (Tuist)
        if: ${{ inputs.use-tuist }}
        shell: bash
        run: mise exec -- tuist generate --no-open

      # ── SwiftPM (when not Tuist) ───────────────────────────────────────────
      - name: Resolve Swift package dependencies
        if: ${{ !inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION"

      # ── Pre-build hooks (caller-provided) ──────────────────────────────────
      # Run unconditionally: a pre-build script may generate sources the compile
      # needs. Generic beats optimal — an app whose hook only feeds the tests
      # pays a few seconds here.
      - name: Pre-build cache
        if: ${{ inputs.pre-build-cache-path != '' }}
        uses: actions/cache@v5
        with:
          path: ${{ inputs.pre-build-cache-path }}
          key: ${{ inputs.pre-build-cache-key }}

      - name: Pre-build script
        if: ${{ inputs.pre-build-script != '' }}
        shell: bash
        run: bash "${{ inputs.pre-build-script }}"

      # ── Compile (no signing) ───────────────────────────────────────────────
      # CODE_SIGNING_ALLOWED=NO + CODE_SIGNING_REQUIRED=NO let xcodebuild compile
      # without selecting an identity or provisioning profile, so fork PRs (where
      # GitHub strips secrets) get the same signal as same-repo ones. `build` and
      # not `archive`: building the app scheme already compiles every embedded
      # extension and links the whole bundle, which is the question a PR asks;
      # archiving adds export + packaging, needs secrets a fork cannot have, and
      # buys no extra compile coverage.
      - name: Compile (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            ${{ inputs.extra-xcodebuild-args }}

      # ── Post-build hook (caller-provided) ──────────────────────────────────
      # The compile runs without -derivedDataPath, so the product is in the
      # default DerivedData location — not predictable from here. Read it back
      # from the same scheme/configuration/destination/args the compile used.
      # QUOTE the result: the store leg's configuration is typically
      # "Release Store", so BUILT_PRODUCTS_DIR contains a space, and an
      # unquoted expansion passes on Direct and fails only on the store leg.
      - name: Post-build script
        if: ${{ inputs.post-build-script != '' }}
        shell: bash
        env:
          POST_BUILD_SCRIPT: ${{ inputs.post-build-script }}
        run: |
          set -euo pipefail
          settings=$(xcodebuild -showBuildSettings \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            ${{ inputs.extra-xcodebuild-args }} 2>/dev/null)
          dir=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *BUILT_PRODUCTS_DIR = /{print $2; exit}')
          name=$(printf '%s\n' "$settings" | awk -F' = ' '/^ *FULL_PRODUCT_NAME = /{print $2; exit}')
          [ -n "$dir" ] && [ -n "$name" ] && [ -e "$dir/$name" ] || {
            echo "::error::could not locate the built product for scheme '$SCHEME' (configuration '$CONFIGURATION')"
            exit 1
          }
          echo "Running post-build script on: $dir/$name"
          bash "$POST_BUILD_SCRIPT" "$dir/$name"

  # ── Tests (opt-in) — red PR check on failure, no Jira ticket ─────────────
  # Single run against the shared core; test-scheme / app-name default to the
  # first discovered product's identity when not passed explicitly.
  test:
    if: inputs.run-tests
    needs: discover
    uses: LeanBytes/workflows-macos/.github/workflows/_test.yml@v0.5.7
    with:
      test-runner: ${{ inputs.test-runner }}
      runs-on: ${{ inputs.runs-on-test }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      test-scheme: ${{ inputs.test-scheme != '' && inputs.test-scheme || fromJSON(needs.discover.outputs.products)[0].scheme }}
      test-plan: ${{ inputs.test-plan }}
      use-tuist: ${{ inputs.use-tuist }}
      xcodebuild-test-args: ${{ inputs.xcodebuild-test-args }}
      app-name: ${{ inputs.app-name != '' && inputs.app-name || fromJSON(needs.discover.outputs.products)[0].product-name }}
      swift-package-path: ${{ inputs.swift-package-path }}
      swift-test-filter: ${{ inputs.swift-test-filter }}
      coverage-min: ${{ inputs.coverage-min }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      file-jira-on-failure: false
      gate-on-new-commit: false
    secrets:
      SHARED_WORKFLOWS_TOKEN: ${{ secrets.SHARED_WORKFLOWS_TOKEN }}
