# ── Release Distribution Orchestrator ────────────────────────────────────────
# Called from a per-app shell triggered on a per-product version tag push —
# bare `vX.Y.Z` for the primary product, `<id>-vX.Y.Z` for the others — with
# beta/alpha tags excluded.
#
# `products.py plan-release` parses the tag → the single target product,
# validates the version against THAT product's inline changelog, and returns
# its Direct leg. Only Direct builds again: a Direct binary carries its version,
# and stable users must never get one that says beta. App Store legs build
# nothing — the build you tested in TestFlight is the one you submit in App
# Store Connect — so for a product without a Direct leg the tag is just the
# marker of what shipped, and this run ends green after the check.
#
# Strict fail-safe publish order — the GH Release is created LAST:
#   1. Read notes from the product's inline changelog
#   2. S3 upload of DMG/ZIP          (silent)
#   3. S3 upload of the product's Changelog.json (extracted from its file)
#   4. Stable appcast update         (if the direct leg sets "appcast": true) ← visible
#   5. gh release create             (for the tag)
#   6. gh release upload (DMG + ZIP)
#
# Per-app shell (the full one is examples/per-app/distribute-release.yml):
#
#   on:
#     push:
#       tags:
#         - 'v*'
#         - '*-v*'
#         - '!*-beta.*'
#         - '!*-alpha.*'
#   jobs:
#     release:
#       uses: LeanBytes/workflows-macos/.github/workflows/distribute-release.yml@v0.6.2
#       secrets:
#         DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
#         # …
# ─────────────────────────────────────────────────────────────────────────────
name: distribute-release

on:
  workflow_call:
    inputs:
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"
      use-tuist:
        type: boolean
        default: false
      pre-build-cache-path:
        type: string
        default: ""
      pre-build-cache-key:
        type: string
        default: ""
      pre-build-script:
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""
      extra-xcodebuild-args:
        type: string
        default: ""
      runs-on-prepare:
        description: "Runner for the prepare job (parses the release tag). Runs FIRST and every other job needs it, so a repo with no self-hosted Mac must point this at a hosted image too."
        type: string
        default: '["self-hosted","macOS"]'
      build-timeout-minutes:
        description: "Ceiling for the build job. Forwarded to the build callee."
        type: number
        default: 60
      archive-timeout-minutes:
        description: "Ceiling for the Archive step inside the build job. Must stay under build-timeout-minutes."
        type: number
        default: 30
      runs-on-build-mac-direct:
        description: "Runner for the Developer ID (Direct) archive."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-publish:
        type: string
        default: '["self-hosted","macOS"]'
      lfs:
        description: "Pull the caller repo's git LFS files on checkout. Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded build artifacts in a private repo (default 7; a public repo keeps them one day). They're consumed within the run, so this is mostly for post-hoc debugging."
        type: number
        default: 7
      attach-release-assets:
        description: "Attach the DMG/ZIP to the GitHub Release. Default true. Set false to save GitHub storage/bandwidth — the DMG/ZIP still upload to S3 (the real distribution) and the appcast points there; only the redundant GitHub copy is skipped. Notes + tag are still created."
        type: boolean
        default: true
      create-discussion:
        description: |
          Auto-create a GitHub Discussion alongside the release. OFF by default —
          `gh release create --discussion-category` is a single atomic call, and
          if the category lookup fails the WHOLE release create fails. Validate in
          a sandbox before enabling.
        type: boolean
        default: false
      discussion-category:
        description: 'Discussions category name when create-discussion is true (default "Announcements").'
        type: string
        default: "Announcements"
    # Declared so cross-org / cross-account callers (where `secrets: inherit`
    # silently passes nothing) can pass secrets explicitly.
    secrets:
      DEVELOPER_ID_P12_BASE64:        { required: false }
      DEVELOPER_ID_PASSWORD:          { required: false }
      # A leg can sign with another certificate (e.g. a legacy team kept after
      # an account transfer) by naming these in "cert-secret" /
      # "cert-password-secret". Unset falls back to the team's own.
      DEVELOPER_ID_P12_ALT_BASE64:    { required: false }
      DEVELOPER_ID_PASSWORD_ALT:      { required: false }
      KEYCHAIN_PASSWORD:              { required: false }
      ASC_KEY_ID:                     { required: false }
      ASC_ISSUER_ID:                  { required: false }
      ASC_KEY_BASE64:                 { required: false }
      AWS_ACCESS_KEY_ID:              { required: false }
      AWS_SECRET_ACCESS_KEY:          { required: false }
      SPARKLE_ED_PRIVATE_KEY:         { required: false }
      SHARED_WORKFLOWS_TOKEN:         { required: false }

permissions:
  contents: write          # create GH Release + upload assets
  discussions: write       # opt-in create-discussion

jobs:
  prepare:
    # `vars.RUNS_ON_PREPARE` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PREPARE || fromJSON(inputs.runs-on-prepare) }}
    timeout-minutes: 5
    outputs:
      target-id: ${{ steps.plan.outputs.target-id }}
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build-number }}
      artifact-label: ${{ steps.plan.outputs.artifact-label }}
      legs: ${{ steps.plan.outputs.legs }}
      mac-direct-legs: ${{ steps.plan.outputs.mac-direct-legs }}
      has-mac-direct: ${{ steps.plan.outputs.has-mac-direct }}
      has-appcast: ${{ steps.plan.outputs.has-appcast }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Plan release (parse the tag → its product, validate vs its changelog)
        id: plan
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
          TAG: ${{ github.ref_name }}
        run: python3 .shared-ci/.github/scripts/products.py plan-release >> "$GITHUB_OUTPUT"

      - name: Show target
        run: echo "Releasing '${{ steps.plan.outputs.target-id }}' v${{ steps.plan.outputs.version }} from tag '${{ github.ref_name }}' — Direct leg present ${{ steps.plan.outputs.has-mac-direct }}"

  build-mac-direct:
    if: needs.prepare.outputs.has-mac-direct == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.mac-direct-legs) }}
    uses: LeanBytes/workflows-macos/.github/workflows/_build-mac-direct.yml@v0.6.2
    with:
      post-build-script: ${{ inputs.post-build-script }}
      job-timeout-minutes: ${{ inputs.build-timeout-minutes }}
      archive-timeout-minutes: ${{ inputs.archive-timeout-minutes }}
      version: ${{ matrix.leg.marketing }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-label: ${{ matrix.leg.artifact-label }}
      artifact-name: mac-direct-build-${{ matrix.leg.leg }}
      scheme-name: ${{ matrix.leg.scheme }}
      product-name: ${{ matrix.leg.product-name }}
      configuration: ${{ matrix.leg.configuration }}
      use-tuist: ${{ inputs.use-tuist }}
      pre-build-cache-path: ${{ inputs.pre-build-cache-path }}
      pre-build-cache-key: ${{ inputs.pre-build-cache-key }}
      pre-build-script: ${{ inputs.pre-build-script }}
      runs-on: ${{ inputs.runs-on-build-mac-direct }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      DEVELOPER_ID_P12_BASE64: ${{ matrix.leg.cert-secret != '' && secrets[matrix.leg.cert-secret] || secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_PASSWORD:   ${{ matrix.leg.cert-password-secret != '' && secrets[matrix.leg.cert-password-secret] || secrets.DEVELOPER_ID_PASSWORD }}
      KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID:              ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:           ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:          ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:  ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  publish-release:
    needs: [prepare, build-mac-direct]
    # Only a built Direct leg publishes. 'cancelled' must not get through: a
    # wedged or evicted build job would otherwise publish a release with the
    # build silently missing (see #10).
    if: |
      always() &&
      needs.build-mac-direct.result != 'failure' && needs.build-mac-direct.result != 'cancelled' &&
      needs.build-mac-direct.result == 'success'
    # `vars.RUNS_ON_PUBLISH` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_PUBLISH || fromJSON(inputs.runs-on-publish) }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      ARTIFACT_LABEL: ${{ needs.prepare.outputs.artifact-label }}
      LEGS_JSON: ${{ needs.prepare.outputs.legs }}
      PRODUCTS_DIR: ${{ inputs.products-dir }}
      TARGET_ID: ${{ needs.prepare.outputs.target-id }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ job.workflow_sha || 'job.workflow_sha-is-empty' }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Download mac-direct-build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mac-direct-build-*
          path: ./artifacts/mac-direct

      - name: Expand legs
        shell: bash
        run: |
          set -euo pipefail
          # \x1f (Unit Separator), NOT tab — tab is IFS-whitespace and `read`
          # would collapse empty fields (e.g. an empty s3-subpath), shifting
          # every later column. \x1f is non-whitespace and never in the data.
          python3 - "$LEGS_JSON" > /tmp/legs.tsv <<'PY'
          import json, sys
          fields = ["leg", "id", "product-name", "s3-subpath", "appcast-filename",
                    "appcast-seed-path", "changelog-filename", "appcast"]
          for l in json.loads(sys.argv[1]):
              print("\x1f".join(str(l.get(k, "")) for k in fields))
          PY
          echo "Legs:"; tr '\037' '\t' < /tmp/legs.tsv

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          # actions/download-artifact extracts a LONE matched artifact flat into
          # the base path (no per-artifact subdir); multiple matches DO get subdirs
          # (merge-multiple defaults false). Re-nest a flattened artifact so the
          # per-leg globs below can always assume artifacts/mac-direct/<name>/ —
          # otherwise a single-leg release finds "no DMG".
          while IFS=$'\x1f' read -r leg _; do
            base="./artifacts/mac-direct"; want="$base/mac-direct-build-$leg"
            if [ -d "$base" ] && [ ! -d "$want" ] && [ -n "$(find "$base" -maxdepth 1 -type f 2>/dev/null)" ]; then
              mkdir -p "$want"
              find "$base" -maxdepth 1 -type f -exec mv {} "$want"/ \;
              echo "re-nested flattened artifact → $want/"
            fi
          done < /tmp/legs.tsv

      # ── Release notes from the target product's inline changelog ──────────
      - name: Read release notes from the product changelog
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG_PATH="${PRODUCTS_DIR}/${TARGET_ID}.json" VERSION="$VERSION" \
            .shared-ci/.github/scripts/changelog-from-json.sh > /tmp/notes.md || : > /tmp/notes.md
          echo "Notes ($(wc -c < /tmp/notes.md) bytes):"; cat /tmp/notes.md

      - name: Install AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws &>/dev/null; then
            curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
            sudo installer -pkg /tmp/AWSCLIV2.pkg -target /
            rm -f /tmp/AWSCLIV2.pkg
          fi
          aws --version

      - name: Upload DMG + ZIP to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname sub afile aseed clfile acast; do
            echo "::group::S3 upload — $leg"
            DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}"
            for f in ./artifacts/mac-direct/mac-direct-build-$leg/*.dmg ./artifacts/mac-direct/mac-direct-build-$leg/*.zip; do
              [ -e "$f" ] || continue
              aws s3 cp "$f" "${DEST}/$(basename "$f")"
              echo "Uploaded $(basename "$f") → ${DEST}/"
            done
            echo "::endgroup::"
          done < /tmp/legs.tsv

      # ── Changelog.json → S3, extracted from the product's inline changelog ─
      - name: Upload Changelog.json to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname sub afile aseed clfile acast; do
            # Publish ONLY the product's .changelog (schema-identical to the old
            # Changelog.json) — never the build identity in the product file.
            python3 -c 'import json,sys; json.dump(json.load(open(sys.argv[1]))["changelog"], open(sys.argv[2],"w"))' \
              "${PRODUCTS_DIR}/$id.json" "/tmp/cl-$id.json"
            DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}"
            aws s3 cp "/tmp/cl-$id.json" "${DEST}/${clfile}" --content-type "application/json"
            echo "Uploaded ${clfile} → ${DEST}/"
          done < /tmp/legs.tsv

      # ── GATE: Stable appcast update ────────────────────────────────────────
      - name: Download Sparkle
        if: needs.prepare.outputs.has-appcast == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SPARKLE_TAG=$(gh api /repos/sparkle-project/Sparkle/releases/latest --jq '.tag_name')
          echo "Sparkle version: ${SPARKLE_TAG}"
          curl -fL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TAG}/Sparkle-${SPARKLE_TAG}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          chmod +x /tmp/sparkle/bin/generate_appcast

      - name: Update Sparkle stable appcast
        if: needs.prepare.outputs.has-appcast == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "eu-central-1"
          S3_DISTRIBUTION_PATH: ${{ vars.S3_DISTRIBUTION_PATH }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r leg id pname sub afile aseed clfile acast; do
            [ "$acast" = "True" ] || continue
            echo "::group::Stable appcast — $leg"
            WORK="/tmp/appcast-$id"
            rm -rf "$WORK"; mkdir -p "$WORK"   # LB-459: start clean (persistent self-hosted /tmp)
            cp ./artifacts/mac-direct/mac-direct-build-$leg/*.zip "$WORK"/
            DEST="${S3_DISTRIBUTION_PATH}${sub:+/$sub}"
            if aws s3 cp "${DEST}/${afile}" "${WORK}/${afile}"; then
              echo "Downloaded existing ${afile}"
            else
              echo "No ${afile} on S3, seeding from ${aseed}"
              cp "${aseed}" "${WORK}/${afile}"
            fi
            echo "$SPARKLE_ED_PRIVATE_KEY" | /tmp/sparkle/bin/generate_appcast --ed-key-file - "${WORK}/"
            NOTES=""
            [ -s /tmp/notes.md ] && NOTES=$(cat /tmp/notes.md)
            VERSION="$VERSION" NOTES="$NOTES" APPCAST_PATH="${WORK}/${afile}" \
              .shared-ci/.github/scripts/update-appcast.sh
            aws s3 cp "${WORK}/${afile}" "${DEST}/${afile}" --content-type "application/xml"
            echo "Uploaded ${afile} → ${DEST}/ (stable live for $id)"
            echo "::endgroup::"
          done < /tmp/legs.tsv

      # ── FINAL: GitHub Release for the tag ──────────────────────────────────
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_DISCUSSION: ${{ inputs.create-discussion }}
          DISCUSSION_CATEGORY: ${{ inputs.discussion-category }}
        run: |
          set -euo pipefail
          ARGS=(--repo "${{ github.repository }}" --title "${{ github.ref_name }}")
          if [ -f /tmp/notes.md ] && [ -s /tmp/notes.md ]; then
            ARGS+=(--notes-file /tmp/notes.md)
          else
            ARGS+=(--notes "Release ${{ github.ref_name }}")
          fi
          if [ "$CREATE_DISCUSSION" = "true" ] && [ -n "$DISCUSSION_CATEGORY" ]; then
            ARGS+=(--discussion-category "$DISCUSSION_CATEGORY")
          fi
          gh release create "${{ github.ref_name }}" "${ARGS[@]}"

      - name: Attach DMG + ZIP to GH Release
        if: inputs.attach-release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=( ./artifacts/mac-direct/mac-direct-build-*/*.dmg ./artifacts/mac-direct/mac-direct-build-*/*.zip )
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No DMG/ZIP assets to attach"; exit 0
          fi
          gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber "${ASSETS[@]}"

      - name: Write release summary
        shell: bash
        env:
          S3_DOWNLOAD_URL: ${{ vars.S3_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          {
            echo "## Release ${{ github.ref_name }} published ✅"
            echo
            echo "**Product:** \`${TARGET_ID}\` · **Version:** \`${VERSION}\` · **Build:** \`${BUILD_NUMBER}\`"
            echo
            echo "| Artifact | Download |"
            echo "|---|---|"
            while IFS=$'\x1f' read -r leg id pname sub afile aseed clfile acast; do
              BASE="${S3_DOWNLOAD_URL}${sub:+/$sub}"
              echo "| DMG | [${pname}_${ARTIFACT_LABEL}.dmg](${BASE}/${pname}_${ARTIFACT_LABEL}.dmg) |"
              echo "| ZIP | [${pname}_${ARTIFACT_LABEL}.zip](${BASE}/${pname}_${ARTIFACT_LABEL}.zip) |"
            done < /tmp/legs.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/sparkle /tmp/sparkle.tar.xz /tmp/appcast-* /tmp/notes.md /tmp/cl-*.json /tmp/legs.tsv
