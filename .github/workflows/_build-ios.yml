# ── Internal Build Callee — iPhone and iPad (App Store, Ad Hoc) ─────────────
# Produces a signed .ipa, published as a GitHub Actions workflow artifact
# (named by the artifact-name input; default "ios-build"). An orchestrator
# downloads the artifact and uploads it with `xcrun altool --type ios` — or, for
# an Ad Hoc leg, puts it on S3 with a manifest for itms-services installs.
#
# Both channels archive and sign identically; only the profile type and the
# export method differ. No notarization, no DMG, no Sparkle.
#
# Provisioning profiles come from App Store Connect: the first step downloads
# every profile of the leg's type, and the app and each of its extensions
# (widgets, intents, a Watch app) are signed with the profile for their own
# bundle ID. No profile is stored in GitHub and none is named anywhere.
#
# Each secret reaches only the steps that use it: the certificate the keychain
# step, the App Store Connect key the profile step.
#
# Underscore prefix marks this as an internal callee — per-app shells should
# call the distribute-*.yml orchestrators, not this file directly.
#
# Required caller secrets:
#   APPLE_DISTR_P12_BASE64  — Apple Distribution cert + private key (signs the .app)
#   APPLE_DISTR_PASSWORD    — password for the Apple Distribution p12
#   KEYCHAIN_PASSWORD       — ephemeral build keychain password
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64  — App Store Connect API key
#                             (downloads the profiles)
#
# Required caller inputs (identity comes from the caller's product list):
#   scheme, profile-type, export-method
# ─────────────────────────────────────────────────────────────────────────────
name: _build-ios

on:
  workflow_call:
    inputs:
      # ── Required ───────────────────────────────────────────────────────────
      version:
        description: "Marketing version (CFBundleShortVersionString), bare X.Y.Z"
        required: true
        type: string
      build-number:
        description: "Build number (CFBundleVersion), timestamp-based"
        required: true
        type: string

      # ── Product identity (supplied by the caller's product list) ───────────
      scheme:
        description: "Xcode scheme to archive."
        required: true
        type: string
      profile-type:
        description: "App Store Connect profile type: IOS_APP_STORE (TestFlight, App Store) or IOS_APP_ADHOC (registered devices)."
        required: true
        type: string
      export-method:
        description: "ExportOptions method: app-store-connect, or release-testing for Ad Hoc (Xcode still accepts the old 'ad-hoc' spelling but calls it deprecated)."
        required: true
        type: string
      artifact-name:
        description: "GH Actions artifact name for the .ipa upload. Suffix per leg to avoid matrix collisions."
        type: string
        default: "ios-build"
      internal-only:
        description: "Mark the build in App Store Connect as internal-only: it never reaches external testers or the App Store. Set by distribute-alpha.yml."
        type: boolean
        default: false

      # ── Runner ─────────────────────────────────────────────────────────────
      job-timeout-minutes:
        description: "Ceiling for the whole build job. Raise it for a slow archive; lower it to fail fast. Keep archive-timeout-minutes below it, or the step cap bites first."
        type: number
        default: 60

      archive-timeout-minutes:
        description: "Ceiling for the Archive step alone, so a signing stall fails at a named step instead of eating the job. Must stay under job-timeout-minutes."
        type: number
        default: 30

      runs-on:
        description: "JSON-encoded runner label or array"
        type: string
        default: '["self-hosted","macOS"]'

      # ── Checkout ───────────────────────────────────────────────────────────
      lfs:
        description: "Pull the caller repo's git LFS files on checkout (e.g. an LFS-tracked model). Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded artifacts in a private repo (default 7). A public repo keeps them one day: anyone signed in to GitHub can download them, and the publish job needs them for minutes."
        type: number
        default: 7

      # ── Project type ───────────────────────────────────────────────────────
      use-tuist:
        description: "Project is generated by Tuist (runs tuist install + generate before build)"
        type: boolean
        default: false

      # ── Build hooks (caller-provided) ──────────────────────────────────────
      pre-build-cache-path:
        description: "Path to cache via actions/cache@v5 (e.g. 'MyApp/Models/asset.bin'). Empty = no cache."
        type: string
        default: ""
      pre-build-cache-key:
        description: "Cache key. Required when pre-build-cache-path is set."
        type: string
        default: ""
      pre-build-script:
        description: "Path (relative to caller repo) of a bash script to run before archive. Sees the cache-restored files."
        type: string
        default: ""
      post-build-script:
        description: "Path of a bash script to run after the app is built, called with the built .app bundle as $1. Non-zero exits fail the job. Use it to inspect what was produced — architecture slices, bundle contents, entitlements."
        type: string
        default: ""

      # ── Build configuration ────────────────────────────────────────────────
      configuration:
        description: "Xcode build configuration to archive (e.g. Release, Release Store). Must match a configuration declared in the caller's .xcodeproj."
        type: string
        default: "Release"

      # ── Escape hatch ───────────────────────────────────────────────────────
      extra-xcodebuild-args:
        description: "Additional xcodebuild settings appended to archive command"
        type: string
        default: ""

    # Secrets must be declared (not just inherited) when the originating
    # caller of the reusable-workflow chain is in a different org than this
    # repo — `secrets: inherit` is org-scoped against the OUTERMOST caller,
    # not the immediate caller, so it refuses at every hop in the chain
    # when the chain crosses an org boundary anywhere.
    secrets:
      APPLE_DISTR_P12_BASE64:         { required: true }
      APPLE_DISTR_PASSWORD:           { required: true }
      KEYCHAIN_PASSWORD:              { required: true }
      ASC_KEY_ID:                     { required: true }
      ASC_ISSUER_ID:                  { required: true }
      ASC_KEY_BASE64:                 { required: true }
      # Only needed when the originating caller consumes a PRIVATE fork of
      # workflows-macos; the shared-scripts checkout falls back to github.token.
      SHARED_WORKFLOWS_TOKEN:         { required: false }

permissions:
  contents: read

jobs:
  build:
    # `vars.RUNS_ON_BUILD_IOS` overrides this with no commit — see README, "Moving a job
    # off the self-hosted Mac". Unset is '' (falsy), so the input is the default.
    runs-on: ${{ vars.RUNS_ON_BUILD_IOS || fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: ${{ inputs.lfs }}

      # workflows-macos itself (this repo) — pinned to the SAME commit as this
      # reusable workflow, so profiles.py can never skew from the YAML.
      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-macos
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      # Every profile of the leg's type the team has. Archive and export match them to
      # the app and each extension by bundle ID. Before any of the app's code
      # runs (Tuist, SwiftPM plugins, the pre-build script), so none of it ever
      # runs next to the App Store Connect key. Into RUNNER_TEMP, which is
      # emptied before and after every job.
      - name: Download provisioning profiles
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          PROFILE_TYPE: ${{ inputs.profile-type }}
        run: python3 .shared-ci/.github/scripts/profiles.py fetch --type "$PROFILE_TYPE" --out "$RUNNER_TEMP/profiles" --install

      # ── Tuist (opt-in) ─────────────────────────────────────────────────────
      - name: Install Tuist (via mise)
        if: inputs.use-tuist
        shell: bash
        run: |
          set -euo pipefail
          # The `brew tap tuist/tuist` cask is broken upstream (invalid
          # `conflicts_with formula:` stanza), so Tuist is installed through mise,
          # via its official one-liner (the method used on the self-hosted runner).
          # mise lands in ~/.local/bin — add it to PATH now and to $GITHUB_PATH so
          # the Fetch/Generate steps below find it. A committed mise.toml pin is
          # honored, else latest. CI sets CI=true so mise auto-trusts the config.
          export PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null 2>&1 || curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install
          mise exec -- tuist --version >/dev/null 2>&1 || mise use tuist@latest

      - name: Fetch Swift package dependencies (Tuist)
        if: inputs.use-tuist
        shell: bash
        run: mise exec -- tuist install

      - name: Generate Xcode project (Tuist)
        if: inputs.use-tuist
        shell: bash
        run: mise exec -- tuist generate --no-open

      # ── SwiftPM (when not Tuist) ───────────────────────────────────────────
      - name: Resolve Swift package dependencies
        if: ${{ !inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release

      # ── Pre-build hooks (caller-provided) ──────────────────────────────────
      - name: Pre-build cache
        if: inputs.pre-build-cache-path != ''
        uses: actions/cache@v5
        with:
          path: ${{ inputs.pre-build-cache-path }}
          key: ${{ inputs.pre-build-cache-key }}

      - name: Pre-build script
        if: inputs.pre-build-script != ''
        shell: bash
        run: bash "${{ inputs.pre-build-script }}"

      # ── Diagnostic: verify .p12 envelope before security import ────────────
      # `security import` only says "MAC verification failed (wrong password?)"
      # which conflates: bad base64, wrong password, incompatible crypto.
      # We run openssl to get a clearer signal — but DON'T trust its exit code:
      # OpenSSL 3.x exits non-zero on legacy cert PBE algorithms (e.g. RC2)
      # even when the MAC verified fine, because the default provider can't
      # enumerate the safebags. Instead we look for explicit "Mac verify error"
      # in the output, which is the only reliable wrong-password signal.
      - name: Verify .p12 envelope (diagnostic)
        shell: bash
        env:
          APPLE_DISTR_P12_BASE64: ${{ secrets.APPLE_DISTR_P12_BASE64 }}
          APPLE_DISTR_PASSWORD: ${{ secrets.APPLE_DISTR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_DISTR_P12_BASE64" | base64 --decode > /tmp/certificate-check.p12

          SIZE=$(wc -c < /tmp/certificate-check.p12)
          echo "Decoded .p12 size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::.p12 is suspiciously small ($SIZE bytes) — likely a base64 encoding issue with APPLE_DISTR_P12_BASE64"
            exit 1
          fi

          # Don't fail on non-zero exit; we evaluate the output instead.
          # -nokeys: never print private keys (essential).
          # -nocerts: also suppress cert PEM blocks. Certs are public so this
          # is paranoid but trims the log to envelope metadata only.
          openssl pkcs12 -in /tmp/certificate-check.p12 -info -nokeys -nocerts \
            -passin "pass:$APPLE_DISTR_PASSWORD" > /tmp/p12-info.txt 2>&1 || true

          echo "── openssl output ──────────────────────────────────────────"
          cat /tmp/p12-info.txt
          echo "────────────────────────────────────────────────────────────"

          if grep -qE "Mac verify error|invalid password" /tmp/p12-info.txt; then
            echo "::error::Password mismatch — APPLE_DISTR_PASSWORD does not match the .p12"
            rm -f /tmp/certificate-check.p12 /tmp/p12-info.txt
            exit 1
          fi

          echo "Envelope check passed — no MAC verification error. (security import will validate the rest.)"
          rm -f /tmp/certificate-check.p12 /tmp/p12-info.txt

      # ── Keychain ───────────────────────────────────────────────────────────
      # iPhone distribution needs ONE cert: Apple Distribution, which signs the
      # .app. (The Mac App Store additionally needs Mac Installer Distribution
      # to sign a .pkg — an .ipa needs neither.)
      - name: Set up keychain
        shell: bash
        env:
          APPLE_DISTR_P12_BASE64: ${{ secrets.APPLE_DISTR_P12_BASE64 }}
          APPLE_DISTR_PASSWORD: ${{ secrets.APPLE_DISTR_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$APPLE_DISTR_P12_BASE64" | base64 --decode > /tmp/apple-distr.p12

          # Self-hosted runners persist state between jobs, so a build.keychain
          # left behind by a hard-cancelled run would make create-keychain abort
          # with "A keychain with the same name already exists" under set -e.
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # A freshly created keychain inherits macOS's defaults: lock-on-sleep
          # and a 300s idle-lock. Nothing touches the keychain while the compiler
          # runs, so on any archive that takes longer than five minutes to reach
          # signing the timer expires mid-build and codesign blocks forever on an
          # unlock prompt no headless runner ever answers (the job then burns to
          # its timeout with no error, #9). set-key-partition-list below does not
          # cover this — it suppresses the authorization prompt for an UNLOCKED
          # keychain, not the unlock prompt for a locked one. No -t and no -l ⇒
          # no timeout, no sleep-lock; the keychain is deleted in Cleanup.
          security set-keychain-settings build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import /tmp/apple-distr.p12 \
            -k build.keychain \
            -P "$APPLE_DISTR_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          rm /tmp/apple-distr.p12

      # ── Verify signing identity (debug) ────────────────────────────────────
      - name: Verify signing identity
        shell: bash
        run: security find-identity -v -p codesigning build.keychain

      # ── Archive ────────────────────────────────────────────────────────────
      - name: Archive
        # Bounded so a signing stall fails in minutes with a diagnosable step
        # rather than wedging until the 60-minute job timeout (see #9).
        timeout-minutes: ${{ inputs.archive-timeout-minutes }}
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PROFILE_TYPE: ${{ inputs.profile-type }}
        run: |
          set -euo pipefail

          # App Store Connect requires CFBundleShortVersionString to be 1-3
          # dotted integers (e.g. "2.10.0"). Strip any suffix as a safety net —
          # the orchestrators already pass the bare version. Build-number
          # remains the per-build differentiator (CFBundleVersion).
          MARKETING_VERSION="${INPUT_VERSION%%-*}"
          echo "Marketing version (stripped for ASC): ${MARKETING_VERSION}"
          echo "Build number:                          ${{ inputs.build-number }}"

          # LB-459: /tmp/build persists across jobs on a self-hosted runner. Start
          # from a clean slot so a prior product's (or a killed job's) archive /
          # export can't ride along in the *.ipa upload glob below.
          rm -rf /tmp/build
          mkdir -p /tmp/build

          # Each target signs with the profile for its own bundle ID (see
          # profiles.py archive-args). Read line by line: a setting may contain
          # spaces.
          SIGN=()
          while IFS= read -r a; do SIGN+=("$a"); done < <(python3 .shared-ci/.github/scripts/profiles.py \
            archive-args --profiles "$RUNNER_TEMP/profiles/profiles.json" --type "$PROFILE_TYPE" --cert "Apple Distribution")
          [ "${#SIGN[@]}" -gt 0 ] || { echo "::error::no signing settings from profiles.py"; exit 1; }

          xcodebuild archive \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -archivePath /tmp/build/app.xcarchive \
            -destination "generic/platform=iOS" \
            "${SIGN[@]}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION=${{ inputs.build-number }} \
            ${{ inputs.extra-xcodebuild-args }}

      # ── Post-build hook (caller-provided) ──────────────────────────────────
      # The .app inside the archive, NOT the exported artifact — export here
      # produces an .ipa, and a caller's script should never have to branch on
      # which channel invoked it. Running before export also fails ahead of the
      # slow, network-bound upload steps.
      - name: Post-build script
        if: inputs.post-build-script != ''
        shell: bash
        env:
          POST_BUILD_SCRIPT: ${{ inputs.post-build-script }}
        run: |
          set -euo pipefail
          # Exactly one .app is expected; this workflow takes no product-name
          # input, so glob rather than construct the path by name.
          shopt -s nullglob
          apps=(/tmp/build/app.xcarchive/Products/Applications/*.app)
          [ "${#apps[@]}" -eq 1 ] || {
            echo "::error::post-build: expected exactly one .app in the archive, found ${#apps[@]}"
            exit 1
          }
          echo "Running post-build script on: ${apps[0]}"
          bash "$POST_BUILD_SCRIPT" "${apps[0]}"

      # ── Export ─────────────────────────────────────────────────────────────
      # Every app and extension in the archive gets the profile for its bundle
      # ID; printed so a mismatch is obvious in the log (bundle ids and profile
      # names, nothing secret). manageAppVersionAndBuildNumber is false: its
      # default rewrites CFBundleVersion and destroys the timestamp build number.
      - name: Export
        shell: bash
        env:
          INTERNAL_ONLY: ${{ inputs.internal-only }}
          PROFILE_TYPE: ${{ inputs.profile-type }}
          EXPORT_METHOD: ${{ inputs.export-method }}
        run: |
          set -euo pipefail
          python3 .shared-ci/.github/scripts/profiles.py export-options \
            --profiles "$RUNNER_TEMP/profiles/profiles.json" --type "$PROFILE_TYPE" \
            --archive /tmp/build/app.xcarchive --method "$EXPORT_METHOD" \
            --cert "Apple Distribution" --internal-only "$INTERNAL_ONLY" \
            --out /tmp/build/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath /tmp/build/app.xcarchive \
            -exportPath /tmp/build/export \
            -exportOptionsPlist /tmp/build/ExportOptions.plist

          ls -lh /tmp/build/export/

      # ── Diagnostic on export failure ───────────────────────────────────────
      # xcodebuild writes detailed logs to a temp .xcdistributionlogs directory.
      # Print key info inline (keychain identities + log contents) and stage
      # the directory for upload in the next step. Only runs on failure so it
      # doesn't pollute successful runs.
      - name: Diagnose export failure
        if: failure()
        shell: bash
        run: |
          echo "── Keychain identities (codesigning policy) ───────────────"
          security find-identity -v -p codesigning build.keychain || true
          echo ""
          echo "── ALL keychain identities (no policy filter) ────────────"
          security find-identity -v build.keychain || true
          echo ""
          echo "── xcdistributionlogs ────────────────────────────────────"
          # find through /var/folders triggers permission warnings → noisy
          # exits under pipefail. Search $TMPDIR first (where xcodebuild
          # actually writes), fall back to /var/folders with || true so a
          # failed find doesn't kill the diagnostic.
          LOG_DIR=""
          if [ -n "${TMPDIR:-}" ]; then
            LOG_DIR=$(find "$TMPDIR" -maxdepth 2 -name "*.xcdistributionlogs" -type d 2>/dev/null | head -1 || true)
          fi
          if [ -z "$LOG_DIR" ]; then
            LOG_DIR=$(find /var/folders -maxdepth 6 -name "*.xcdistributionlogs" -type d 2>/dev/null | head -1 || true)
          fi
          if [ -z "$LOG_DIR" ]; then
            echo "No xcdistributionlogs directory found"
            exit 0
          fi
          echo "Found: $LOG_DIR"
          echo ""
          ls -la "$LOG_DIR"
          for f in "$LOG_DIR"/*; do
            [ -f "$f" ] || continue
            echo ""
            echo "── $(basename "$f") ──────────────────────────────────"
            cat "$f"
          done
          # Stage for the upload step (paths in /var/folders aren't artifact-friendly)
          mkdir -p /tmp/diag-logs
          cp -R "$LOG_DIR" /tmp/diag-logs/

      - name: Upload xcdistributionlogs as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcdistributionlogs-${{ inputs.artifact-name }}
          path: /tmp/diag-logs/
          if-no-files-found: warn
          retention-days: ${{ github.event.repository.private == false && 1 || inputs.artifact-retention-days }}

      # ── Publish as workflow artifact ───────────────────────────────────────
      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: /tmp/build/export/*.ipa
          if-no-files-found: error
          retention-days: ${{ github.event.repository.private == false && 1 || inputs.artifact-retention-days }}

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          security delete-keychain build.keychain || true
          python3 .shared-ci/.github/scripts/profiles.py cleanup --out "$RUNNER_TEMP/profiles" || true
          rm -rf /tmp/build /tmp/diag-logs
          security list-keychains -d user -s login.keychain
