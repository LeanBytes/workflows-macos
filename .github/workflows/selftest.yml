name: selftest

# CI for workflows-macos itself (the repo has no other self-CI): lint every
# workflow and run the offline suite (products.py, profiles.py, the wiring of
# every workflow call, examples included) whenever .github/**, examples/** or
# tests/** change. `job.workflow_sha` and shellcheck style findings are ignored:
# GitHub added the former on 2026-04-23, after actionlint 1.7.12; the latter are
# the intentional "read all TSV columns, use a subset" publish loops.

on:
  pull_request:
    paths:
      - '.github/**'
      - 'examples/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'examples/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  lint-and-test:
    # ubuntu-latest, and NOT self-hosted like the rest of this repo. No
    # self-hosted runner is attached to workflows-macos — the org's macOS runner
    # serves the app repos — so `[self-hosted, macOS]` here queued forever and
    # this workflow silently did not run for 27 days (a queued job reports
    # nothing, so it never went red). Nothing here needs a Mac anyway: actionlint
    # is a static binary and the tests are offline python3 + git.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        # Into a temp dir, not the workspace: a self-hosted runner reuses its
        # checkout, so dropping the binary next to the sources would leave an
        # untracked ./actionlint behind between runs.
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" \
            -ignore 'property "workflow_sha" is not defined in object type \{check_run_id' \
            -ignore 'shellcheck reported issue' \
            .github/workflows/*.yml

      # Needs python3, git, openssl and yq — all on ubuntu-latest.
      - name: Offline tests
        run: bash tests/run.sh
